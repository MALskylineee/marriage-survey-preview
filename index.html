function cardDefaults(){
  const inc = {};
  for (const f of CARD_ME) inc[f.id] = f.on;
  inc.__want = true;
  return inc;
}
function cardState(){
  if (!state.card) state.card = { name:"", inc:cardDefaults() };
  if (!state.card.inc) state.card.inc = cardDefaults();
  return state.card;
}

function cardModel(){
  const cs = cardState();
  const g = A("gender");
  const me = CARD_ME
    .filter(f => cs.inc[f.id])
    .map(f => ({ k:f.k, v:clean(f.v()) }))
    .filter(r => r.v);
  const want = cs.inc.__want
    ? activeCriteria().filter(c => !!c.value).map(c => ({ k:c.label, v:c.value, db:c.db }))
    : [];
  const age = ownAge();
  return {
    name: (cs.name || "").trim() || (g === "أنثى" ? "عروس" : "عريس"),
    subtitle: [ g === "أنثى" ? "تبحث عن زوج" : "يبحث عن زوجة",
                age ? `${ar(age)} سنة` : "", A("resGov") || "" ].filter(Boolean).join(" · "),
    me, want,
  };
}

/* ---- رسم البطاقة كصورة PNG (واتساب) — بلا أي مكتبة خارجية ---- */
function cardToPNG(){
  const m = cardModel();
  const W = 1000, P = 48, LH = 46;
  const cv = document.createElement("canvas");
  const ctx = cv.getContext("2d");
  const F = (sz, b) => `${b?"bold ":""}${sz}px "Segoe UI",Tahoma,Arial,sans-serif`;

  // قياس الارتفاع أولاً
  let h = 0;
  h += 150;                                   // الترويسة
  h += 30 + 44;                               // عنوان «عني»
  h += m.me.length * LH;
  if (m.want.length){ h += 40 + 44 + m.want.length * LH; }
  h += 90;                                    // التذييل
  // ترسم بدقة مضاعفة ثم تُصغَّر — نص حادّ على شاشات الهواتف بدل صورة مهترئة
  const S = 3;
  cv.width = W * S; cv.height = h * S;
  ctx.scale(S, S);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  ctx.direction = "rtl";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";

  // الخلفية والإطار
  ctx.fillStyle = "#FFFDF9"; ctx.fillRect(0,0,W,h);
  ctx.strokeStyle = "#A8763A"; ctx.lineWidth = 4; ctx.strokeRect(3,3,W-6,h-6);

  // الترويسة
  const hg = ctx.createLinearGradient(0,0,W,144);
  hg.addColorStop(0,"#123B2D"); hg.addColorStop(1,"#1D5C46");
  ctx.fillStyle = hg; ctx.fillRect(3,3,W-6,144);
  ctx.fillStyle = "#C9973F"; ctx.fillRect(3,144,W-6,3);
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.font = F(46, true); ctx.fillText(m.name, W/2, 62);
  ctx.font = F(26);       ctx.fillText(m.subtitle, W/2, 112);
  ctx.textAlign = "right";

  let y = 150;
  const RX = W - P;                            // حافة النص اليمنى
  const section = (title) => {
    y += 30;
    ctx.fillStyle = "#1D5C46"; ctx.font = F(32, true);
    ctx.fillText(title, RX, y + 16);
    y += 44;
    ctx.strokeStyle = "#A8763A66"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(P, y-8); ctx.lineTo(RX, y-8); ctx.stroke();
  };
  const row = (k, v, db) => {
    ctx.font = F(24);       ctx.fillStyle = "#6E6459";  ctx.fillText(k, RX, y + LH/2);
    ctx.font = F(26, true); ctx.fillStyle = "#2B2622";
    ctx.textAlign = "left";
    if (db){ ctx.fillStyle = "#A8763A"; ctx.fillText("★", P, y + LH/2); ctx.fillStyle = "#2B2622"; ctx.fillText(v, P + 34, y + LH/2); } else ctx.fillText(v, P, y + LH/2);
    ctx.textAlign = "right";
    ctx.strokeStyle = "#F1E9DB"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(P, y+LH-2); ctx.lineTo(RX, y+LH-2); ctx.stroke();
    y += LH;
  };

  section("عني");
  for (const r of m.me) row(r.k, r.v, false);
  if (m.want.length){
    section("ما أبحث عنه");
    for (const r of m.want) row(r.k, r.v, r.db);
  }

  // التذييل
  ctx.fillStyle = "#F6F0E6"; ctx.fillRect(3, h-87, W-6, 84);
  ctx.fillStyle = "#6E6459"; ctx.font = F(22); ctx.textAlign = "center";
  ctx.fillText("★ = شرط حاسم لا يقبل التنازل", W/2, h-58);
  ctx.fillText("بطاقة أعدّها صاحبها بنفسه ليسهّل على من يعينه في البحث", W/2, h-26);

  cv.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "بطاقة-التعريف.png";
    a.click();
  }, "image/png");
}

/* ---- «المرآة» في الشاشة ---- */
function mirrorBlock(){
  const box = el("div");
  const crit = activeCriteria();

  box.appendChild(el("h2", null, "مرآتك — ما الذي تبحث عنه فعلاً؟"));

  if (!crit.length){
    box.appendChild(el("div", "note", "لم تحدد معايير كافية بعد، فلا نستطيع أن نعرض لك صورة صادقة."));
    return box;
  }

  const dw = domainWeights().filter(d => d.pct > 0);
  const top = dw[0];

  const head = el("div", "headline");
  head.appendChild(el("div", "k", "أثقل ما في اختيارك"));
  head.appendChild(el("div", "v", top.label));
  box.appendChild(head);
  box.appendChild(el("div", "muted", "هذا ما قالته إجاباتك — لا ما نظن نحن. الترتيب محسوب من درجات الأهمية التي اخترتها بنفسك."));

  dw.forEach((d, i) => {
    const w = el("div", "dbar d" + Math.min(i+1, 6));
    const t = el("div", "top");
    t.appendChild(el("span", null, d.label));
    t.appendChild(el("span", "muted", d.pct + "٪"));
    w.appendChild(t);
    const tr = el("div", "track"); const fi = el("div", "fill");
    fi.style.width = d.pct + "%"; tr.appendChild(fi); w.appendChild(tr);
    box.appendChild(w);
  });

  const dbs = crit.filter(c => c.db);
  // الحزمة تُعرض رقاقة واحدة كما تُحسب واحداً — حتى لا يختلف العدد هنا عن العدّاد
  box.appendChild(el("h2", null, `شروطك الحاسمة (${ar(dbCount())})`));
  if (dbs.length){
    box.appendChild(el("div", "muted", "من لا يحقق واحداً منها لن يظهر لك إطلاقاً، مهما كان بقية توافقكما."));
    const chips = el("div", "chips");
    const doneBundles = new Set();
    for (const c of dbs){
      const b = bundleOf(c.id);
      if (b){
        if (doneBundles.has(b.id)) continue;
        doneBundles.add(b.id);
        const names = dbs.filter(x => b.members.includes(x.id)).map(x => x.label).join(" · ");
        chips.appendChild(el("span", "chip", `${b.label}: ${names}`));
      } else {
        chips.appendChild(el("span", "chip", `${c.label}: ${c.value}`));
      }
    }
    box.appendChild(chips);
  } else {
    box.appendChild(el("div", "muted", "لم تضع شرطاً حاسماً واحداً."));
  }

  // أُزيلت «دائرة بحثك» — وصفٌ لا يضيف للمستخدم شيئاً (قرار محمد 2026-07-28)

  const refl = reflections();
  if (refl.length){
    box.appendChild(el("h2", null, "وقفة قصيرة مع نفسك"));
    box.appendChild(el("div", "muted", "لسنا نصحح لك — هذه أمور بدت لنا متقاربة في إجاباتك، وأنت وحدك تعرف قصدك."));
    for (const r of refl){
      const d = el("div", "refl");
      d.appendChild(el("span", "t", r.t));
      d.appendChild(document.createTextNode(r.body));
      box.appendChild(d);
    }
  }
  return box;
}

  box.appendChild(el("h1", "noprint", "اكتمل الاستبيان — وهذه ثمرته"));
  box.appendChild(el("p", "muted noprint", `استغرقت تقريباً: ${Math.round(total/60)} دقيقة`));

  // أولاً: ما يخصّ صاحب الإجابات — مرآته، ثم بطاقته
  const mirror = mirrorBlock();
  mirror.className = "noprint";
  box.appendChild(mirror);
  box.appendChild(cardBlock());

  // ما يلي خاص بتجربة النسخة التجريبية فقط
  const t = el("div", "noprint");
  t.appendChild(el("h2", null, "معاينة مبدئية"));
  const nCrit = setCriteria(), nDb = dbCount();
  const ready = el("div", "note");
  ready.textContent =
    `حددت ${nCrit} معياراً فعّالاً، منها ${nDb} شرطاً حاسماً.\n` +
    (nCrit >= MIN_CRITERIA ? "✓ لديك معايير كافية لبدء حساب التوافق." : `تحتاج ${MIN_CRITERIA} معايير على الأقل (ينقصك ${MIN_CRITERIA-nCrit}).`) +
    (nDb <= DB_CAP ? "" : "\n⚠ تجاوزت حد الشروط الحاسمة.");
  t.appendChild(ready);
  // أُزيلت «معاينة التوافق مع شريك افتراضي» — رقم توضيحي لا يقابل شخصاً حقيقياً (قرار محمد 2026-07-28)

  const tbl = el("table");
  const head = el("tr"); head.appendChild(el("th", null, "القسم")); head.appendChild(el("th", null, "الوقت بالثواني"));
  tbl.appendChild(head);
  for (const s of SECTIONS){
    const tr = el("tr");
    tr.appendChild(el("td", null, s.title));
    tr.appendChild(el("td", null, String(state.timings[s.id] || 0)));
    tbl.appendChild(tr);
  }
  t.appendChild(tbl);
  box.appendChild(t);

  box.appendChild(el("h2", "noprint", "رأيك يهمنا"));

  const fb = {};
  const addSelect = (key, label, options) => {
    const fg = el("div", "fg");
    fg.appendChild(el("label", null, label));
    fg.appendChild(makeSelect(options, "", e => { fb[key] = e.target.value; }));
    box.appendChild(fg);
  };
  const addText = (key, label) => {
    const fg = el("div", "fg");
    fg.appendChild(el("label", null, label));
    const t = el("textarea");
    t.addEventListener("change", e => { fb[key] = e.target.value; });
    fg.appendChild(t);
    box.appendChild(fg);
  };
  addSelect("fatigue", "هل شعرت بالإرهاق أثناء الإجابة؟", ["لا","قليلاً","نعم، كان طويلاً"]);
  addText("confusing", "أي الأقسام كان مربكاً أو غير مفهوم؟");
  addSelect("dealbreakerClear", "هل فهمت الفرق بين شرط حاسم وأساسي؟", ["نعم واضح","إلى حد ما","لا، محتاج شرحاً"]);
  // مقاييس النسخة 1.1 — هل أعطى الاستبيانُ صاحبَه شيئاً؟
  addSelect("selfKnowledge", "هل عرّفك هذا الاستبيان على نفسك أكثر؟",
    ["نعم، انتبهت لأمور لم أكن أنتبه لها","إلى حد ما","لا، لم يضف لي شيئاً"]);
  addSelect("mirrorFair", "«الوقفة مع نفسك» — كيف وجدتها؟",
    ["منصفة ومفيدة","مقبولة","شعرت أنها تحكم عليّ"]);
  addSelect("wouldShare", "هل كنت سترسل بطاقة التعريف لمن يساعدك في البحث فعلاً؟",
    ["نعم","ربما","لا"]);
  addText("shareWhy", "ولماذا؟ وما الذي كنت ستحذفه أو تضيفه في البطاقة؟");
  addText("other", "اقتراحات أخرى");

  // إرسال الرأي بضغطة — بلا ملفات ولا خطوات
  const fbText = () => {
    const L = {fatigue:"الإرهاق", confusing:"أقسام مربكة", dealbreakerClear:"وضوح الشرط الحاسم",
               selfKnowledge:"هل عرّفني بنفسي", mirrorFair:"الوقفة مع النفس",
               wouldShare:"هل كنت سأرسل البطاقة", shareWhy:"ولماذا", other:"اقتراحات"};
    const lines = ["رأيي في استبيان الزواج (نسخة تجريبية):"];
    for (const k in L) if (fb[k]) lines.push(`• ${L[k]}: ${fb[k]}`);
    lines.push(`• الوقت: ${Math.round(total/60)} دقيقة تقريباً`);
    return lines.join("\n");
  };
  const shareWrap = el("div", "fg");
  const shareNav = el("div", "nav");
  const wa = el("button", null, "أرسل رأيك عبر واتساب 💬");
  wa.addEventListener("click", () => {
    state.feedback = fb; save();
    window.open("https://wa.me/?text=" + encodeURIComponent(fbText()), "_blank");
  });
  const cp = el("button", "sec", "انسخ رأيك 📋");
  cp.addEventListener("click", async () => {
    state.feedback = fb; save();
    try { await navigator.clipboard.writeText(fbText()); cp.textContent = "تم النسخ ✓"; }
    catch { window.prompt("انسخ النص التالي:", fbText()); }
  });
  shareNav.appendChild(wa); shareNav.appendChild(cp);
  shareWrap.appendChild(shareNav);
  shareWrap.appendChild(el("div", "help",
    "يفتح واتساب ومعه رأيك مكتوباً — تختار أنت لمن ترسله، ولا يُرسل شيء تلقائياً. "+
    "رأيك وحده هو ما يُنسخ، لا إجاباتك."));
  box.appendChild(shareWrap);

  const reviewBtn = el("button", "sec", "مراجعة وتعديل الإجابات");
  reviewBtn.addEventListener("click", () => {
    state.feedback = fb; state.finished = false; state.stepKey = askableSteps()[0].f.id;
    state.enteredAt = Date.now(); save(); render(); window.scrollTo(0,0);
  });
  box.appendChild(reviewBtn);

  box.appendChild(el("h2", null, "أرسل نتيجتك 📥"));
  const sendGuide = el("div", "note");
  sendGuide.textContent =
    "خطوة أخيرة حتى تصلنا تجربتك:\n" +
    "١) اضغط «تنزيل الإجابات» بالأسفل (اختر إكسل أو JSON، أيهما أسهل لك).\n" +
    "٢) سيُحفظ ملف على جهازك.\n" +
    "٣) أرسل هذا الملف لمن أرسل لك الرابط (واتساب أو بريد).\n" +
    "بدون هذه الخطوة لا يصلنا أي شيء — إجاباتك تبقى على جهازك فقط.";
  box.appendChild(sendGuide);

  const nav = el("div", "nav");
  const expJson = el("button", null, "تنزيل الإجابات (ملف JSON)");
  expJson.addEventListener("click", () => {
    state.feedback = fb; save();
    download("spike2a-result.json", "application/json",
      JSON.stringify({version:"spike2a-v1.2", exportedAt:new Date().toISOString(), totalSeconds:total, ...state}, null, 2));
  });
  const expXls = el("button", "sec", "تنزيل كملف إكسل");
  expXls.addEventListener("click", () => {
    state.feedback = fb; save();
    const blob = excelBlob(collectRows());
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "spike2a-result.xlsx";
    a.click();
  });
  nav.appendChild(expJson);
  nav.appendChild(expXls);
  box.appendChild(nav);
  box.appendChild(el("p", "muted", "ينزل ملف — أرسله لصاحب التجربة. لا يُرسل أي شيء تلقائياً."));

  const outro = el("div", "basmala");
  const dv2 = el("div", "divider"); dv2.appendChild(el("span", null, "۞"));
  outro.appendChild(dv2);
  outro.appendChild(el("div", "dua", "بَارَكَ اللَّهُ فِيكُمْ، وَوَفَّقَكُمْ لِلْخَيْرِ حَيْثُ كَانَ، وَيَسَّرَ لَكُمْ أُمُورَكُمْ"));
  box.appendChild(outro);

  app.appendChild(box);
}

buildFontControl();
render();
</script>
</body>
</html>
