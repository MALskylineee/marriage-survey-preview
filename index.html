const app = document.getElementById("app");
const genderOf = () => state.answers.gender;
const optsOf = (f) => typeof f.o === "function" ? f.o(state.answers) : f.o;
const visibleFields = (sec) => sec.fields.filter(f =>
  (!f.g || (f.g==="M"&&genderOf()==="ذكر") || (f.g==="F"&&genderOf()==="أنثى")) &&
  (!f.if || f.if(state.answers)));
const dbCount = () => Object.values(state.imp).filter(v=>v==="شرط حاسم").length;
const setCriteria = () => Object.values(state.imp).filter(v=>v&&v!=="لا يهم").length;
const kidsN = () => { const c = state.answers.kidsCount || ""; return Math.min(parseInt(c) || 0, 7); };
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

const SECTION_VIS = { basic:"card", residence:"card", looks:"card", deen:"match",
  social:"mandatory", edu:"private", habits:"match", work:"private", wedding:"private",
  afterMarriage:"private", skills:"match", reqs:"req" };
const VIS_TEXT = {
  card: "من يراها: تظهر ضمن البطاقة المبدئية المجهّلة (بيانات عامة ونسبة توافق) دون اسمك.",
  match: "من يراها: تُستخدم لحساب نسبة التوافق فقط، لا تظهر كقيمة صريحة في البداية.",
  mandatory: "من يراها: معلومة جوهرية تُعرض مبكراً حتى لا يُفاجأ أحد لاحقاً.",
  private: "من يراها: لا تظهر إلا في مرحلة الكشف الموسّع وبموافقتك.",
  identity: "من يراها: لا تظهر إلا في مراحل التوثيق المتقدمة.",
  req: "من يراها: تفضيلك الخاص لاختيار الشريك — لا يظهر للطرف الآخر إطلاقاً.",
};
function visNoteText(f, sec){
  const vis = f.vis || sec.vis || SECTION_VIS[sec.id] || "match";
  const why = f.why ? ("لماذا نسأل: " + f.why + "\n") : "";
  return why + (VIS_TEXT[vis] || "");
}

// قسمٌ مكتمل: كل حقوله المرئية مُجابة (النصوص اختيارية)، ودرجات الأهمية محددة
function isSectionComplete(sec){
  for (const f of visibleFields(sec)){
    if (f.t === "text" || f.t === "multi") continue;
    if (f.t === "range"){ if (f.req && !state.imp[f.id]) return false; continue; }
    if (f.t === "kidages"){
      const n = kidsN();
      for (let i = 1; i <= n; i++) if (!state.answers[`kidAge_${i}`]) return false;
      continue;
    }
    if (!state.answers[f.id]) return false;
    if (f.req && !state.imp[f.id]) return false;
  }
  return true;
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function makeSelect(options, value, onchange){
  const s = el("select");
  const first = el("option", null, "اختر...");
  first.value = "";
  s.appendChild(first);
  for (const o of options){
    const opt = el("option", null, o);
    if (o === value) opt.selected = true;
    s.appendChild(opt);
  }
  s.addEventListener("change", onchange);
  return s;
}
function makeInput(type, value, attrs, onchange){
  const i = el("input");
  i.type = type;
  if (value !== undefined && value !== null && value !== "") i.value = value;
  for (const k in attrs) i.setAttribute(k, attrs[k]);
  i.addEventListener("change", onchange);
  return i;
}
function buildLabel(h, w){
  if (!h || !w) return "";
  const bmi = w / Math.pow(h/100, 2);
  if (bmi < 18.5) return "نحيف";
  if (bmi < 25) return "متناسق";
  if (bmi < 30) return "ممتلئ قليلاً";
  return "ممتلئ";
}

const RERENDER_ON = new Set(["gender","health","marital","maritalF","kids","kidsCount","education","major","college","workStatus","workStatusF","jobField","finModel","engParty","wedParty","resGov","resCity"]);

function render(){
  const sec = SECTIONS[state.section];
  if (!sec) return renderDone();
  app.replaceChildren();

  const h1 = el("h1", null, "استبيان الزواج ");
  h1.appendChild(el("span", "tag", "نسخة تجريبية"));
  app.appendChild(h1);
  const pctDone = Math.round(state.section / SECTIONS.length * 100);
  app.appendChild(el("p", "muted", `القسم ${state.section+1} من ${SECTIONS.length} — أكملت ${pctDone}٪`));
  if (state.section === 0)
    app.appendChild(el("p", "muted", "يستغرق الاستبيان حوالي ١٠ إلى ١٥ دقيقة. تُحفظ إجاباتك تلقائياً ويمكنك المتابعة لاحقاً."));
  const bar = el("div", "bar"); const fill = el("div");
  fill.style.width = pctDone + "%";
  bar.appendChild(fill); app.appendChild(bar);
  app.appendChild(el("h2", null, sec.title));
  if (sec.intro) app.appendChild(el("p", "muted", sec.intro));

  // التنقل بين الأقسام — للمراجعة والتعديل في أي وقت
  {
    const navWrap = el("div", "fg");
    navWrap.appendChild(el("label", null, "التنقل بين الأقسام (للمراجعة والتعديل)"));
    const jump = el("select");
    SECTIONS.forEach((s, i) => {
      const done = isSectionComplete(s);
      const opt = el("option", null, `${i+1}. ${s.title}${done ? " ✓" : ""}`);
      opt.value = String(i);
      if (i === state.section) opt.selected = true;
      jump.appendChild(opt);
    });
    jump.addEventListener("change", (e) => {
      recordTiming(sec.id);
      state.section = +e.target.value; state.enteredAt = Date.now(); save(); render(); window.scrollTo(0,0);
    });
    navWrap.appendChild(jump);
    app.appendChild(navWrap);
  }

  // استيراد جلسة سابقة — يظهر في أول قسم فقط لتوفير وقت إعادة الإدخال
  if (state.section === 0){
    const impWrap = el("div", "fg");
    const impBtn = el("button", "sec", "استيراد إجابات محفوظة (ملف JSON)");
    const fileIn = el("input");
    fileIn.type = "file";
    fileIn.accept = ".json,application/json";
    fileIn.style.display = "none";
    fileIn.addEventListener("change", () => {
      const file = fileIn.files && fileIn.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result));
          if (typeof data.version !== "string" || !data.version.startsWith("spike2a")){
            alert("هذا الملف ليس ملف إجابات صالحاً"); return;
          }
          // نبدأ من أول قسم بعد الاستيراد حتى تتمكن من المراجعة والتعديل
          state = { answers:data.answers??{}, imp:data.imp??{}, section:0,
            timings:data.timings??{}, enteredAt:Date.now(), startedAt:Date.now(),
            feedback:data.feedback??{} };
          save(); render();
          alert("تم استيراد إجاباتك. يمكنك الآن مراجعة أي قسم وتعديله من قائمة التنقل بالأعلى.");
        } catch { alert("تعذر قراءة الملف"); }
      };
      reader.readAsText(file);
    });
    impBtn.addEventListener("click", () => fileIn.click());
    impWrap.appendChild(impBtn);
    impWrap.appendChild(fileIn);
    impWrap.appendChild(el("div", "help", "أكملت جزءاً في جلسة سابقة على جهاز آخر؟ استورد ملف JSON الذي نزّلته لتكمل من حيث توقفت"));
    app.appendChild(impWrap);
  }

  let dbBox = null;
  if (sec.id === "reqs"){
    dbBox = el("div", "db" + (dbCount()>=DB_CAP ? " full" : ""), `شروطك الحاسمة: ${dbCount()} من ${DB_CAP}`);
    app.appendChild(dbBox);
  }

  for (const f of visibleFields(sec)){
    const fg = el("div", "fg");
    fg.dataset.fid = f.id;
    // سطر العنوان مع زر معلومات (لماذا نسأل / من يراها ومتى)
    const lblRow = el("label", null, f.l);
    const info = el("span", "info", "ⓘ");
    info.title = "لماذا نسأل / من يرى هذه المعلومة";
    lblRow.appendChild(info);
    fg.appendChild(lblRow);
    const note = el("div", "note", visNoteText(f, sec));
    note.style.display = "none";
    info.addEventListener("click", () => {
      note.style.display = note.style.display === "none" ? "block" : "none";
    });
    fg.appendChild(note);
    if (f.h) fg.appendChild(el("div", "help", f.h));
    const clearMissing = () => fg.classList.remove("missing");
    const onAnswer = (e) => {
      state.answers[f.id] = e.target.value; save(); clearMissing();
      if (RERENDER_ON.has(f.id)) render();
    };
    if (f.t === "select"){
      const opts = f.pnts ? [...optsOf(f), PNTS] : optsOf(f);
      fg.appendChild(makeSelect(opts, state.answers[f.id], onAnswer));
    } else if (f.t === "multi"){
      const wrap = el("div", "multi");
      const chosen = Array.isArray(state.answers[f.id]) ? state.answers[f.id] : [];
      for (const o of f.o){
        const lab = el("label");
        const cb = el("input"); cb.type = "checkbox"; cb.checked = chosen.includes(o);
        cb.addEventListener("change", () => {
          const cur = Array.isArray(state.answers[f.id]) ? state.answers[f.id] : [];
          state.answers[f.id] = cb.checked ? [...cur, o] : cur.filter(x=>x!==o);
          save(); clearMissing();
        });
        lab.appendChild(cb); lab.appendChild(el("span", null, o));
        wrap.appendChild(lab);
      }
      fg.appendChild(wrap);
    } else if (f.t === "slider"){
      const wrap = el("div", "single");
      const readout = el("div", "hint",
        state.answers[f.id] ? sliderText(f) : "حرّك المؤشر لاختيار القيمة");
      const r = makeInput("range", state.answers[f.id] ?? Math.round((f.min+f.max)/2), {min:f.min, max:f.max}, ()=>{});
      r.addEventListener("input", (e) => {
        state.answers[f.id] = e.target.value; save(); clearMissing();
        readout.textContent = sliderText(f);
        const hint = document.getElementById("bmiHint");
        if (hint) hint.textContent = bmiText();
      });
      wrap.appendChild(r);
      wrap.appendChild(readout);
      fg.appendChild(wrap);
      if (f.bmi){
        const hint = el("div", "hint", bmiText());
        hint.id = "bmiHint";
        fg.appendChild(hint);
      }
    } else if (f.t === "date"){
      fg.appendChild(makeInput("date", state.answers[f.id], {}, onAnswer));
    } else if (f.t === "text"){
      fg.appendChild(makeInput("text", state.answers[f.id], {}, onAnswer));
    } else if (f.t === "kidages"){
      const n = kidsN();
      for (let i = 1; i <= n; i++){
        const row = el("div", "kidrow");
        row.appendChild(el("span", null, `عمر الابن/الابنة ${i}`));
        row.appendChild(makeInput("number", state.answers[`kidAge_${i}`], {min:0, max:45},
          e => { state.answers[`kidAge_${i}`] = e.target.value; save(); clearMissing(); }));
        fg.appendChild(row);
      }
      if ((state.answers.kidsCount||"") === "7+")
        fg.appendChild(el("div", "help", "يكفي إدخال أعمار السبعة الأكبر"));
    } else if (f.t === "range"){
      const loKey = f.id+"_min", hiKey = f.id+"_max";
      if (!state.answers[loKey]) state.answers[loKey] = String(f.lo);
      if (!state.answers[hiKey]) state.answers[hiKey] = String(f.hi);
      const dual = el("div", "dual");
      const track = el("div", "track");
      const fillseg = el("div", "fillseg");
      dual.appendChild(track);
      dual.appendChild(fillseg);
      const readout = el("div", "hint", rangeText(f));
      const pct = v => (v - f.min) / (f.max - f.min) * 100;
      const paint = () => {
        const lo = +state.answers[loKey], hi = +state.answers[hiKey];
        // RTL: right side is min
        fillseg.style.right = pct(lo) + "%";
        fillseg.style.width = Math.max(0, pct(hi) - pct(lo)) + "%";
      };
      const mk = (key) => {
        const r = makeInput("range", state.answers[key], {min:f.min, max:f.max}, ()=>{});
        r.addEventListener("input", (e) => {
          state.answers[key] = e.target.value;
          let lo = +state.answers[loKey], hi = +state.answers[hiKey];
          if (lo > hi){ [state.answers[loKey], state.answers[hiKey]] = [String(hi), String(lo)]; }
          readout.textContent = rangeText(f);
          paint(); save();
        });
        return r;
      };
      dual.appendChild(mk(loKey));
      dual.appendChild(mk(hiKey));
      paint();
      fg.appendChild(dual);
      fg.appendChild(readout);
    }
    if (f.req){
      const impWrap = el("div", "imp");
      const impSel = el("select");
      const first = el("option", null, "درجة الأهمية...");
      first.value = "";
      impSel.appendChild(first);
      for (const o of IMP){
        const opt = el("option", null, o);
        if (o === state.imp[f.id]) opt.selected = true;
        impSel.appendChild(opt);
      }
      impSel.addEventListener("change", (e) => {
        if (e.target.value === "شرط حاسم" && state.imp[f.id] !== "شرط حاسم" && dbCount() >= DB_CAP){
          e.target.value = state.imp[f.id] ?? "";
          alert("وصلت للحد الأقصى: خمسة شروط حاسمة فقط. خفف شرطاً آخر أولاً.");
          return;
        }
        state.imp[f.id] = e.target.value; save(); fg.classList.remove("missing");
        if (dbBox){
          dbBox.textContent = `شروطك الحاسمة: ${dbCount()} من ${DB_CAP}`;
          dbBox.className = "db" + (dbCount()>=DB_CAP ? " full" : "");
        }
      });
      impWrap.appendChild(impSel);
      fg.appendChild(impWrap);
    }
    app.appendChild(fg);
  }

  const err = el("p", "error");
  app.appendChild(err);
  const nav = el("div", "nav");
  if (state.section > 0){
    const back = el("button", "sec", "السابق");
    back.addEventListener("click", () => {
      recordTiming(sec.id); state.section--; state.enteredAt = Date.now(); save(); render(); window.scrollTo(0,0);
    });
    nav.appendChild(back);
  }
  const next = el("button", null, state.section === SECTIONS.length-1 ? "إنهاء" : "التالي");
  next.addEventListener("click", () => {
    const v = validate(sec);
    if (v){
      err.textContent = v.msg;
      document.querySelectorAll(".fg.missing").forEach(x => x.classList.remove("missing"));
      for (const id of v.ids){
        const box = document.querySelector(`.fg[data-fid="${id}"]`);
        if (box) box.classList.add("missing");
      }
      const firstBox = document.querySelector(".fg.missing");
      if (firstBox) firstBox.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    recordTiming(sec.id); state.section++; state.enteredAt = Date.now(); save(); render(); window.scrollTo(0,0);
  });
  nav.appendChild(next);
  app.appendChild(nav);
}

function sliderText(f){
  return `القيمة: ${state.answers[f.id]} ${f.unit ?? ""}`;
}
function bmiText(){
  const label = buildLabel(+state.answers.height, +state.answers.weight);
  return label ? `مؤشر تقريبي للقوام: ${label} (تقديري، وقد لا يعبر عن البنية الرياضية)` : "";
}
function rangeText(f){
  const lo = state.answers[f.id+"_min"], hi = state.answers[f.id+"_max"];
  let extra = "";
  if (f.id === "rWeight"){
    const h = (+state.answers.rHeight_min + +state.answers.rHeight_max)/2 || null;
    if (h){
      const a = buildLabel(h, +lo), b = buildLabel(h, +hi);
      if (a && b) extra = a===b ? ` — قوام تقريبي: ${a}` : ` — قوام تقريبي: من ${a} إلى ${b}`;
    }
  }
  return `من ${lo} إلى ${hi}${extra}`;
}

function recordTiming(id){ state.timings[id] = (state.timings[id]||0) + Math.round((Date.now()-state.enteredAt)/1000); }

function validate(sec){
  const ids = [];
  let msg = null;
  const flag = (id, m) => { ids.push(id); if (!msg) msg = m; };
  for (const f of visibleFields(sec)){
    if (f.t === "range"){
      const lo = +state.answers[f.id+"_min"], hi = +state.answers[f.id+"_max"];
      if (lo && hi && lo > hi) flag(f.id, `النطاق غير صحيح في: ${f.l}`);
      if (f.id === "rAge" && lo && lo < 18) flag(f.id, "الحد الأدنى للعمر ثمانية عشر عاماً");
      if (f.req && !state.imp[f.id]) flag(f.id, "حدد درجة الأهمية للشروط المظللة");
      continue;
    }
    if (f.t === "slider"){
      if (!state.answers[f.id]) flag(f.id, `حرّك المؤشر في: ${f.l}`);
      continue;
    }
    if (f.t === "kidages"){
      const n = kidsN();
      for (let i = 1; i <= n; i++)
        if (!state.answers[`kidAge_${i}`]) { flag(f.id, `أدخل أعمار الأولاد كاملة`); break; }
      continue;
    }
    if (f.t === "text" || f.t === "multi"){ continue; } // اختيارية
    if (!state.answers[f.id]){ flag(f.id, `أكمل الحقول المظللة`); continue; }
    if (f.id === "dob"){
      const age = (Date.now() - new Date(state.answers.dob).getTime()) / 31557600000;
      if (!(age >= 18)) flag(f.id, "التسجيل لمن أتم الثامنة عشرة فقط");
    }
    if (f.req && !state.imp[f.id]) flag(f.id, "حدد درجة الأهمية للشروط المظللة");
  }
  if (sec.id === "reqs" && ids.length === 0 && setCriteria() < MIN_CRITERIA){
    return { msg: `حدد ${MIN_CRITERIA} شروط على الأقل بدرجة غير "لا يهم" حتى يعمل التوافق`, ids: [] };
  }
  return ids.length || msg ? { msg, ids } : null;
}

// Feature D — نموذج توضيحي مبسّط: يطبّق منطق الشروط الحاسمة (فلتر) وأوزان
// الأهمية على شريك افتراضي ثابت. رقم توضيحي فقط، ليس محرّك التوافق الحقيقي.
const IMP_WEIGHT = { "أساسي":8, "مفضل":4, "يُستحسن":1, "لا يهم":0 };
function strHash(s){ let h = 0; for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; } return h % 100; }
function illustrativeScore(){
  let wSum = 0, wHit = 0, blocked = false;
  for (const sec of SECTIONS){
    for (const f of sec.fields){
      if (!f.req) continue;
      const imp = state.imp[f.id];
      if (!imp || imp === "لا يهم") continue;
      const satisfied = strHash(f.id) < (imp === "شرط حاسم" ? 85 : 72);
      if (imp === "شرط حاسم"){ if (!satisfied) blocked = true; continue; }
      const w = IMP_WEIGHT[imp] || 0;
      wSum += w; if (satisfied) wHit += w;
    }
  }
  const score = wSum === 0 ? (blocked ? 0 : 100) : Math.round(wHit / wSum * 100);
  return { blocked, score };
}

function collectRows(){
  const rows = [["القسم","السؤال","الإجابة","درجة الأهمية"]];
  for (const sec of SECTIONS){
    for (const f of visibleFields(sec)){
      let val = "";
      if (f.t === "range") val = `من ${state.answers[f.id+"_min"]??""} إلى ${state.answers[f.id+"_max"]??""}`;
      else if (f.t === "kidages"){
        const n = kidsN();
        val = Array.from({length:n}, (_,i)=>state.answers[`kidAge_${i+1}`]??"").join(" / ");
      }
      else if (f.t === "multi") val = (state.answers[f.id]||[]).join(" / ");
      else val = state.answers[f.id] ?? "";
      rows.push([sec.title, f.l, String(val), state.imp[f.id] ?? ""]);
    }
  }
  for (const s of SECTIONS) rows.push(["التوقيت", s.title, String(state.timings[s.id]||0) + " ثانية", ""]);
  for (const k in state.feedback) rows.push(["رأي المستخدم", k, state.feedback[k] ?? "", ""]);
  return rows;
}

function download(name, mime, content){
  const blob = new Blob([content], {type: mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

/* إكسل حقيقي: ملف xlsx أصلي (أرشيف مضغوط قياسي) — يفتح بلا أي تحذير،
   والورقة يمين-لليسار والنص محاذى لليمين. بلا أي مكتبات خارجية. */
const xmlEsc = s => String(s).replaceAll("&","&amp;").replaceAll("<","&lt;")
  .replaceAll(">","&gt;").replaceAll('"',"&quot;");

function sheetXml(rows){
  const colLetter = i => String.fromCharCode(65 + i); // A..D
  const rowsXml = rows.map((r, ri) =>
    `<row r="${ri+1}">` + r.map((c, ci) =>
      `<c r="${colLetter(ci)}${ri+1}" t="inlineStr" s="1"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`
    ).join("") + `</row>`
  ).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
    `<sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews>` +
    `<cols><col min="1" max="1" width="26" customWidth="1"/><col min="2" max="2" width="34" customWidth="1"/>` +
    `<col min="3" max="3" width="44" customWidth="1"/><col min="4" max="4" width="18" customWidth="1"/></cols>` +
    `<sheetData>${rowsXml}</sheetData></worksheet>`;
}

    `<cellStyleXfs count="1"><xf/></cellStyleXfs>` +
    `<cellXfs count="2"><xf/><xf applyAlignment="1"><alignment horizontal="right" vertical="center" wrapText="1"/></xf></cellXfs>` +
    `</styleSheet>`,
};

// --- كاتب أرشيف مضغوط قياسي (تخزين بلا ضغط) ---
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const u16 = v => new Uint8Array([v & 255, (v >> 8) & 255]);
  const u32 = v => new Uint8Array([v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]);
  for (const [name, content] of files){
    const nameB = enc.encode(name);
    const data = enc.encode(content);
    const crc = crc32(data);
    const local = [new Uint8Array([0x50,0x4B,3,4]), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0), nameB, data];
    central.push([new Uint8Array([0x50,0x4B,1,2]), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset), nameB]);
    for (const p of local){ parts.push(p); offset += p.length; }
  }
  const centralStart = offset;
  let centralSize = 0;
  for (const entry of central) for (const p of entry){ parts.push(p); centralSize += p.length; }
  parts.push(new Uint8Array([0x50,0x4B,5,6]), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralSize), u32(centralStart), u16(0));
  return new Blob(parts, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function excelBlob(rows){
  return makeZip([
    ["[Content_Types].xml", XLSX_STATIC["[Content_Types].xml"]],
    ["_rels/.rels", XLSX_STATIC["_rels/.rels"]],
    ["xl/workbook.xml", XLSX_STATIC["xl/workbook.xml"]],
    ["xl/_rels/workbook.xml.rels", XLSX_STATIC["xl/_rels/workbook.xml.rels"]],
    ["xl/styles.xml", XLSX_STATIC["xl/styles.xml"]],
    ["xl/worksheets/sheet1.xml", sheetXml(rows)],
  ]);
}

function renderDone(){
  const total = Object.values(state.timings).reduce((a,b)=>a+b, 0);
  app.replaceChildren();
  const box = el("div");
  box.appendChild(el("h1", null, "اكتمل الاستبيان"));
  box.appendChild(el("p", null, `استغرقت تقريباً: ${Math.round(total/60)} دقيقة`));
  const table = el("table");
  const head = el("tr"); head.appendChild(el("th", null, "القسم")); head.appendChild(el("th", null, "الوقت بالثواني"));
  table.appendChild(head);
  for (const s of SECTIONS){
    const tr = el("tr");
    tr.appendChild(el("td", null, s.title));
    tr.appendChild(el("td", null, String(state.timings[s.id] || 0)));
    table.appendChild(tr);
  }
  box.appendChild(table);

  // Feature D — معاينة توافق توضيحية (تجريبية) + ملخص جاهزية حقيقي
  box.appendChild(el("h2", null, "معاينة مبدئية"));
  const nCrit = setCriteria(), nDb = dbCount();
  const ready = el("div", "note");
  ready.textContent =
    `حددت ${nCrit} معياراً فعّالاً، منها ${nDb} شرطاً حاسماً.\n` +
    (nCrit >= MIN_CRITERIA ? "✓ لديك معايير كافية لبدء حساب التوافق." : `تحتاج ${MIN_CRITERIA} معايير على الأقل (ينقصك ${MIN_CRITERIA-nCrit}).`) +
    (nDb <= DB_CAP ? "" : "\n⚠ تجاوزت حد الشروط الحاسمة.");
  box.appendChild(ready);

  const preview = el("div", "preview");
  const demo = illustrativeScore();
  preview.appendChild(el("div", null, "توافقك مع شريك افتراضي متوازن (مثال توضيحي فقط):"));
  if (demo.blocked){
    preview.appendChild(el("div", "big", "غير متوافق"));
    preview.appendChild(el("div", "muted", "في المثال لم يتحقق أحد شروطك الحاسمة، لذا لا يظهر هذا الشريك إطلاقاً — هكذا تعمل الشروط الحاسمة."));
  } else {
    preview.appendChild(el("div", "big", demo.score + "٪"));
    preview.appendChild(el("div", "muted", "رقم توضيحي لتقريب الفكرة فقط، وليس تقييماً لشخص حقيقي. التوافق الفعلي يُحسب بين طرفين حقيقيين."));
  }
  box.appendChild(preview);

  box.appendChild(el("h2", null, "رأيك يهمنا"));

  const fb = {};
  const addSelect = (key, label, options) => {
    const fg = el("div", "fg");
    fg.appendChild(el("label", null, label));
    fg.appendChild(makeSelect(options, "", e => { fb[key] = e.target.value; }));
    box.appendChild(fg);
  };
  const addText = (key, label) => {
    const fg = el("div", "fg");
    fg.appendChild(el("label", null, label));
    const t = el("textarea");
    t.addEventListener("change", e => { fb[key] = e.target.value; });
    fg.appendChild(t);
    box.appendChild(fg);
  };
  addSelect("fatigue", "هل شعرت بالإرهاق أثناء الإجابة؟", ["لا","قليلاً","نعم، كان طويلاً"]);
  addText("confusing", "أي الأقسام كان مربكاً أو غير مفهوم؟");
  addSelect("dealbreakerClear", "هل فهمت الفرق بين شرط حاسم وأساسي؟", ["نعم واضح","إلى حد ما","لا، محتاج شرحاً"]);
  addText("other", "اقتراحات أخرى");

  const reviewBtn = el("button", "sec", "مراجعة وتعديل الإجابات");
  reviewBtn.addEventListener("click", () => {
    state.feedback = fb; state.section = 0; state.enteredAt = Date.now(); save(); render(); window.scrollTo(0,0);
  });
  box.appendChild(reviewBtn);

  const nav = el("div", "nav");
  const expJson = el("button", null, "تنزيل الإجابات (ملف JSON)");
  expJson.addEventListener("click", () => {
    state.feedback = fb; save();
    download("spike2a-result.json", "application/json",
      JSON.stringify({version:"spike2a-v0.4", exportedAt:new Date().toISOString(), totalSeconds:total, ...state}, null, 2));
  });
  const expXls = el("button", "sec", "تنزيل كملف إكسل");
  expXls.addEventListener("click", () => {
    state.feedback = fb; save();
    const blob = excelBlob(collectRows());
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "spike2a-result.xlsx";
    a.click();
  });
  nav.appendChild(expJson);
  nav.appendChild(expXls);
  box.appendChild(nav);
  box.appendChild(el("p", "muted", "ينزل ملف — أرسله لصاحب التجربة. لا يُرسل أي شيء تلقائياً."));
  app.appendChild(box);
}

render();
</script>
</body>
</html>
