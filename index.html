<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استبيان الزواج — نسخة تجريبية</title>
<!-- Track A throwaway (ADR-0006) v0.3 — Mohamed's 2nd review 2026-07-23:
     single dual-handle sliders (dwarfism-friendly minimums), profile
     height/weight sliders, expanded districts + "other" free text, kids 7+,
     missing-field highlighting, RTL Excel export, jewelry/tattoo fields with
     requirement counterparts (profile<->requirement correlation principle). -->
<style>
  /* ============================================================
     «بيت» — ورقٌ دافئ وظلٌّ أخضر
     لوحة مستوحاة من بيت مصري في ضوء العصر: حجر جيري دافئ،
     أخضر زيتوني عميق، ونحاسٌ لا يظهر إلا في اللحظات ذات المعنى.
     فاتح فقط · أدنى قياس ١٦ بكسل · بلا أي مورد خارجي.
     ============================================================ */
  :root{
    --paper:#FBF7F0;        /* ورق حجري دافئ بدل الأبيض العيادي */
    --paper-2:#F6F0E6;      /* غائر خفيف للحقول والآبار */
    --paper-3:#FFFDF9;      /* بطاقات مرتفعة */
    --ink:#2B2622;          /* أسود دافئ، لا رمادي بارد */
    --ink-soft:#6E6459;
    --ink-faint:#9A8F82;
    --green:#1D5C46;        /* أخضر فناء المسجد */
    --green-deep:#123B2D;
    --green-soft:#E7EFE9;
    --green-line:#1D5C4626;
    --brass:#A8763A;        /* نحاس — للمعنى لا للزينة */
    --brass-deep:#7E5522;
    --brass-soft:#F7EEDF;
    --brass-line:#A8763A44;
    --rose:#9C3B30;         /* للتنبيه، هادئ لا صارخ */
    --rose-soft:#FBEDEA;
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
    --sh-1:0 1px 2px rgba(43,38,34,.05), 0 1px 1px rgba(43,38,34,.04);
    --sh-2:0 2px 4px rgba(43,38,34,.04), 0 10px 24px -12px rgba(43,38,34,.18);
    --sh-in:inset 0 1px 2px rgba(43,38,34,.05);
    --ease:cubic-bezier(.22,.68,.36,1);
    /* نسخ عربية ذات طابع للعناوين، وأخرى واضحة للحقول */
    --font-display:"Sakkal Majalla","Traditional Arabic","Noto Naskh Arabic","Geeza Pro","Amiri","Segoe UI",serif;
    --font-body:"Segoe UI","Tajawal","Cairo","Noto Sans Arabic",Tahoma,sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust:100%; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:var(--font-body); line-height:1.65;
    /* حبيبات ورق خفيفة جداً — تُحسّ ولا تُرى */
    background-image:
      radial-gradient(circle at 18% 12%, #1D5C4608, transparent 42%),
      radial-gradient(circle at 88% 4%, #A8763A0A, transparent 38%);
    background-attachment:fixed;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: .85rem 1rem 2.4rem; }

  h1 { font-family:var(--font-display); font-size:1.65rem; font-weight:700;
       letter-spacing:.2px; margin-bottom:.25rem; color:var(--green-deep); line-height:1.5; }
  h2 { font-family:var(--font-display); font-size:1.3rem; margin:1.1rem 0 .5rem;
       color:var(--green); font-weight:700; line-height:1.5; }
  .muted { color:var(--ink-soft); font-size: 1rem; }

  /* شريط التقدم — نبضة هادئة لا شريط مصنع */
  .bar { height: 8px; background:#EAE2D6; border-radius:var(--r-pill);
         margin:.35rem 0 .9rem; overflow:hidden; box-shadow:var(--sh-in); }
  .bar > div { height:100%; width:0; border-radius:var(--r-pill);
    background:linear-gradient(90deg, var(--green-deep), var(--green) 60%, #2E7A5E);
    transition:width .55s var(--ease); }

  .fg { margin-bottom:.7rem; border-radius:var(--r-sm); padding:.15rem .3rem;
        transition:background .25s var(--ease); }
  .fg.missing { background:var(--rose-soft); outline:2px solid #D9A79F; outline-offset:2px; }
  label { display:block; font-weight:600; margin-bottom:.35rem; color:var(--ink); }
  .help { font-size:.95rem; color:var(--ink-soft); margin-bottom:.35rem; line-height:1.6; }
  .hint { font-size:.95rem; color:var(--green); margin-top:.2rem; }

  .info { display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px;
    border-radius:50%; border:1px solid var(--brass-line); color:var(--brass-deep); font-size:.78rem;
    cursor:pointer; margin-inline-start:.4rem; background:var(--brass-soft);
    transition:transform .2s var(--ease), background .2s var(--ease); }
  .info:hover { transform:scale(1.12); background:#F1E2CB; }

  .note { background:var(--paper-2); border:1px solid #E4DACB; border-radius:var(--r-md);
    padding:.65rem .85rem; font-size:.95rem; color:var(--ink); margin:.4rem 0;
    white-space:pre-line; line-height:1.75; box-shadow:var(--sh-1); }

  .multi { display:flex; flex-wrap:wrap; gap:.4rem; }
  .multi label { display:inline-flex; align-items:center; gap:.35rem; font-weight:400;
    border:1px solid #DFD5C6; border-radius:var(--r-pill); padding:.3rem .68rem; cursor:pointer;
    margin:0; background:var(--paper-3); box-shadow:var(--sh-1);
    transition:border-color .2s var(--ease), background .2s var(--ease), transform .12s var(--ease); }
  .multi label:hover { border-color:var(--green); }
  .multi label:active { transform:scale(.98); }
  .multi label:has(input:checked) { background:var(--green-soft); border-color:var(--green);
    color:var(--green-deep); font-weight:600; }
  .multi input { width:auto; accent-color:var(--green); }

  .preview { background:var(--green-soft); border:1px solid var(--green-line);
    border-radius:var(--r-md); padding:1rem; margin:1rem 0; }
  .preview .big { font-size:2rem; font-weight:700; color:var(--green); font-family:var(--font-display); }

  /* الافتتاح والدعاء */
  .basmala { text-align:center; margin:.6rem 0 1.3rem; }
  .basmala .salam { color:var(--ink-soft); font-size:1rem; margin-bottom:.6rem; }
  .basmala .bism { color:var(--green-deep); font-size:1.85rem; font-weight:700; line-height:1.9;
    font-family:var(--font-display); letter-spacing:.3px; }
  .basmala .dua { color:var(--green); font-size:1.08rem; margin-top:.6rem; font-family:var(--font-display); }
  .divider { display:flex; align-items:center; gap:.7rem; color:var(--brass);
    margin:.85rem auto; max-width:300px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px;
    background:linear-gradient(to right, transparent, var(--brass-line) 35%, var(--brass-line) 65%, transparent); }
  .divider span { font-size:1.35rem; line-height:1; opacity:.85; }
  .thanks { text-align:center; color:var(--green); font-weight:600; margin:.8rem 0; font-size:1.1rem; }

  /* فقاعات الحوار — الصوت الذي يرافق المستخدم */
  .bubble { background:var(--paper-3); border:1px solid #E7DDCE; border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px;
    padding:.8rem 1rem; margin:.55rem 0; font-size:1.1rem; line-height:1.75; color:var(--ink);
    box-shadow:var(--sh-1); }
  .bubble.bridge { border:none; color:#F7F2E9; font-weight:600; font-family:var(--font-display);
    font-size:1.22rem; letter-spacing:.2px; box-shadow:var(--sh-2);
    background:linear-gradient(135deg, var(--green-deep), var(--green) 70%, #276B52);
    position:relative; overflow:hidden; }
  /* زخرفة عربية خافتة داخل شريط القسم */
  .bubble.bridge::after { content:"۞"; position:absolute; inset-inline-end:.6rem; top:50%;
    transform:translateY(-50%); font-size:2.8rem; opacity:.16; line-height:1; pointer-events:none; }
  /* عنوان بطاقة فرعي — أخضر فاتح مع شريط جانبي، لا يشبه فقاعة السؤال أبداً */
  .bubble.sub { background:var(--green-soft); border:1px solid var(--green-line);
    border-inline-start:4px solid var(--green); border-radius:var(--r-md);
    color:var(--green-deep); font-weight:700; font-family:var(--font-display);
    font-size:1.15rem; padding:.65rem .9rem; box-shadow:none; }
  .taprow { text-align:left; margin-bottom:.25rem; }
  /* الحركة عند الانتقال لسؤال جديد فقط — لا مع كل اختيار داخل البطاقة نفسها */
  .qwrap.anim { animation:rise .34s var(--ease) both; }
  .qwrap.anim .fg { animation:rise .38s var(--ease) both; }
  .qwrap.anim .fg:nth-of-type(1){animation-delay:.03s} .qwrap.anim .fg:nth-of-type(2){animation-delay:.08s}
  .qwrap.anim .fg:nth-of-type(3){animation-delay:.13s} .qwrap.anim .fg:nth-of-type(4){animation-delay:.18s}
  .qwrap.anim .fg:nth-of-type(5){animation-delay:.23s}
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .qwrap.anim, .qwrap.anim .fg { animation:none !important; }
    .bar > div { transition:none; }
  }

  /* الحقول */
  select, input, textarea { width:100%; font-size:1rem; font-family:inherit; color:var(--ink);
    padding:.62rem .8rem; border:1px solid #DFD5C6; border-radius:var(--r-sm);
    background:var(--paper-3); box-shadow:var(--sh-1);
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease); }
  /* السهم يقع في نهاية السطر (يسار في العربية) والنص يبدأ من اليمين */
  select { appearance:none; -webkit-appearance:none;
    padding-inline-start:.8rem; padding-inline-end:2.2rem;
    background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),
                     linear-gradient(135deg,var(--green) 50%,transparent 50%);
    background-position:.9rem calc(50% + 1px), 1.24rem calc(50% + 1px);
    background-size:7px 7px, 7px 7px; background-repeat:no-repeat; }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--green);
    box-shadow:0 0 0 3px #1D5C461f; }
  textarea { min-height:76px; line-height:1.7; }
  /* صفوف أعمار الأولاد مضغوطة — سبعة صفوف يجب أن تتسع في شاشة واحدة */
  /* تاريخ الميلاد: ثلاث قوائم — بلا كتابة */
  .dob { display:flex; gap:.45rem; }
  .dob select { flex:1; min-width:0; padding-inline-start:.5rem; padding-inline-end:1.7rem;
    background-position:.55rem calc(50% + 1px), .89rem calc(50% + 1px); }

  /* تكبير الخط وتصغيره — ثابت في الزاوية، متاح دائماً */
  .fontctl { position:fixed; inset-block-end:.7rem; inset-inline-start:.7rem; z-index:40;
    display:flex; gap:.3rem; align-items:center; background:var(--paper-3);
    border:1px solid #E0D6C7; border-radius:var(--r-pill); padding:.25rem .35rem;
    box-shadow:var(--sh-2); }
  .fontctl button { background:none; color:var(--green-deep); border:none; box-shadow:none;
    padding:.2rem .5rem; font-size:1rem; font-weight:700; line-height:1.2; min-width:2rem;
    border-radius:var(--r-pill); }
  .fontctl button:hover { background:var(--green-soft); filter:none; box-shadow:none; }
  .fontctl button:active { transform:none; }
  .fontctl .lbl { font-size:.78rem; color:var(--ink-soft); padding-inline:.25rem; }
  @media (max-width:400px){ .fontctl { inset-block-end:.5rem; inset-inline-start:.5rem; } }

  .kidrow { display:flex; gap:.5rem; align-items:center; margin-top:.14rem; }
  .kidrow span { min-width:6.5rem; color:var(--ink-soft); }
  .kidrow input { padding:.38rem .6rem; }

  /* المنزلقة المزدوجة */
  .dual { position:relative; height:30px; margin-top:.3rem; }
  .dual .track { position:absolute; top:13px; right:0; left:0; height:6px;
    background:#EAE2D6; border-radius:var(--r-pill); box-shadow:var(--sh-in); }
  .dual .fillseg { position:absolute; top:13px; height:6px; border-radius:var(--r-pill);
    background:linear-gradient(90deg,var(--green),#2E7A5E); }
  .dual input[type=range] { position:absolute; top:5px; right:0; left:0; width:100%;
    background:none; border:none; padding:0; box-shadow:none;
    pointer-events:none; -webkit-appearance:none; appearance:none; }
  .dual input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none;
    width:23px; height:23px; border-radius:50%; background:var(--green); border:2.5px solid var(--paper-3);
    box-shadow:0 2px 6px rgba(43,38,34,.28); pointer-events:auto; cursor:grab; }
  .dual input[type=range]::-moz-range-thumb { width:23px; height:23px; border-radius:50%;
    background:var(--green); border:2.5px solid var(--paper-3);
    box-shadow:0 2px 6px rgba(43,38,34,.28); pointer-events:auto; cursor:grab; }
  .single input[type=range] { padding:0; accent-color:var(--green); box-shadow:none; border:none;
    background:none; }

  .imp { margin-top:.4rem; }
  .imp select { border-color:var(--green-line); background:var(--green-soft); }

  .db { position:sticky; top:0; z-index:5; background:var(--brass-soft);
    border:1px solid var(--brass-line); border-radius:var(--r-md); padding:.55rem .85rem;
    margin-bottom:1rem; font-size:1rem; color:var(--brass-deep); font-weight:600;
    box-shadow:var(--sh-1); }
  .db.full { background:var(--rose-soft); border-color:#E0B5AE; color:var(--rose); }

  /* الأزرار */
  .nav { display:flex; gap:.7rem; margin-top:.85rem; }
  button { font-size:1.02rem; font-family:inherit; font-weight:600; padding:.75rem 1.5rem;
    border:none; border-radius:var(--r-pill); color:#F7F2E9; cursor:pointer;
    background:linear-gradient(160deg,var(--green),var(--green-deep));
    box-shadow:0 2px 5px rgba(18,59,45,.22), inset 0 1px 0 #ffffff1f;
    transition:transform .13s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease); }
  button:hover { filter:brightness(1.08); box-shadow:0 4px 12px rgba(18,59,45,.26); }
  button:active { transform:translateY(1px) scale(.99); box-shadow:0 1px 3px rgba(18,59,45,.2); }
  button:focus-visible { outline:2px solid var(--brass); outline-offset:2px; }
  button.sec { background:var(--paper-2); color:var(--ink); border:1px solid #E0D6C7;
    box-shadow:var(--sh-1); }
  button.sec:hover { background:#F0E8DA; filter:none; }

  .error { color:var(--rose); margin-top:.5rem; font-weight:600; }
  table { border-collapse:collapse; margin:.8rem 0; width:100%;
    background:var(--paper-3); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--sh-1); }
  td, th { border-bottom:1px solid #EFE7DA; padding:.45rem .7rem; font-size:.95rem; text-align:right; }
  th { background:var(--paper-2); color:var(--green-deep); font-weight:700; }
  .tag { display:inline-block; background:var(--brass-soft); color:var(--brass-deep);
    border:1px solid var(--brass-line); border-radius:var(--r-pill);
    padding:.1rem .6rem; font-size:.8rem; font-weight:600; }

  /* ---- «المرآة» ---- */
  .headline { border-radius:var(--r-md); padding:1.15rem 1.2rem; margin:1rem 0; color:#F7F2E9;
    background:linear-gradient(135deg,var(--green-deep),var(--green) 65%,#2A6E54);
    box-shadow:var(--sh-2); position:relative; overflow:hidden; }
  .headline::after { content:"۞"; position:absolute; inset-inline-start:-.4rem; bottom:-1.4rem;
    font-size:5.4rem; opacity:.1; line-height:1; }
  .headline .k { font-size:1rem; opacity:.86; letter-spacing:.3px; }
  .headline .v { font-size:1.6rem; font-weight:700; margin-top:.25rem; line-height:1.55;
    font-family:var(--font-display); position:relative; }

  .dbar { margin:.65rem 0; }
  .dbar .top { display:flex; justify-content:space-between; font-size:1rem; margin-bottom:.3rem; }
  .dbar .track { height:13px; background:#EFE7DA; border-radius:var(--r-pill); overflow:hidden;
    box-shadow:var(--sh-in); }
  .dbar .fill { height:100%; background:var(--green); border-radius:var(--r-pill);
    transition:width .7s var(--ease); }
  .dbar.d2 .fill { background:#357C61; } .dbar.d3 .fill { background:#5C9C82; }
  .dbar.d4 .fill { background:#8ABAA5; } .dbar.d5 .fill { background:#B4D3C6; }
  .dbar.d6 .fill { background:#D6E6DD; }

  .chips { display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0; }
  .chip { background:var(--brass-soft); border:1px solid var(--brass-line); color:var(--brass-deep);
    border-radius:var(--r-pill); padding:.35rem .9rem; font-size:.95rem; box-shadow:var(--sh-1); }

  .refl { background:var(--paper-3); border:1px solid #EAE0D1;
    border-inline-start:3px solid var(--brass); border-radius:var(--r-md);
    padding:.8rem 1rem; margin:.65rem 0; font-size:1rem; line-height:1.85; box-shadow:var(--sh-1); }
  .refl .t { font-weight:700; color:var(--green-deep); display:block; margin-bottom:.2rem;
    font-family:var(--font-display); font-size:1.08rem; }

  .band { display:inline-block; border-radius:var(--r-pill); padding:.28rem .9rem; font-weight:700; }
  .band.b1 { background:var(--green-soft); color:var(--green-deep); }
  .band.b2 { background:var(--green-soft); color:var(--green-deep); }
  .band.b3 { background:var(--brass-soft); color:var(--brass-deep); }
  .band.b4 { background:var(--rose-soft); color:var(--rose); }

  /* ---- بطاقة التعريف — تُحفظ لا تُملأ ---- */
  .card { border:1px solid var(--brass-line); border-radius:var(--r-md); overflow:hidden;
    margin:1rem 0; background:var(--paper-3); box-shadow:var(--sh-2); }
  .card .chead { padding:1.05rem 1rem .95rem; text-align:center; color:#F7F2E9;
    background:linear-gradient(140deg,var(--green-deep),var(--green) 72%);
    position:relative; }
  /* شريط نحاسي رفيع يفصل الترويسة — تفصيلة الحرفي */
  .card .chead::after { content:""; position:absolute; inset-inline:0; bottom:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--brass) 30%,#D9A961 50%,var(--brass) 70%,transparent); }
  .card .chead .nm { font-size:1.5rem; font-weight:700; font-family:var(--font-display);
    letter-spacing:.3px; }
  .card .chead .sb { font-size:1rem; opacity:.9; margin-top:.25rem; }
  .card .csec { padding:.85rem 1.05rem; }
  .card .csec + .csec { border-top:1px solid #EFE6D8; }
  .card .csec h4 { color:var(--green); font-size:1.15rem; margin-bottom:.55rem;
    font-family:var(--font-display); display:flex; align-items:center; gap:.5rem; }
  .card .csec h4::after { content:""; flex:1; height:1px;
    background:linear-gradient(to right,var(--brass-line),transparent); }
  .card .row { display:flex; gap:.6rem; padding:.34rem 0; font-size:1rem;
    border-bottom:1px solid #F4ECDF; }
  .card .row:last-child { border-bottom:none; }
  .card .row .k { color:var(--ink-soft); min-width:8.5rem; }
  .card .row .v { font-weight:600; color:var(--ink); }
  .card .row.db .v::after { content:" ★"; color:var(--brass); font-weight:400; }
  .card .cfoot { background:var(--paper-2); padding:.7rem 1rem; font-size:.85rem;
    color:var(--ink-soft); text-align:center; border-top:1px solid #EFE6D8; }

  .toggles { display:flex; flex-wrap:wrap; gap:.4rem; margin:.55rem 0 1rem; }
  .toggles label { display:inline-flex; align-items:center; gap:.4rem; font-weight:400; margin:0;
    border:1px solid #DFD5C6; border-radius:var(--r-pill); padding:.34rem .75rem; cursor:pointer;
    font-size:.9rem; background:var(--paper-3); transition:all .18s var(--ease); }
  .toggles label:has(input:checked) { background:var(--green-soft); border-color:var(--green);
    color:var(--green-deep); }
  .toggles label.sens { border-color:var(--brass-line); background:var(--brass-soft); }
  .toggles label.sens:has(input:checked) { background:#F0E0C6; border-color:var(--brass); }
  .toggles input { width:auto; accent-color:var(--green); }

  /* ---- شاشة الأولويات ---- */
  .pick { display:flex; flex-wrap:wrap; gap:.55rem; margin:.85rem 0 1rem; }
  .pick button { background:var(--paper-3); color:var(--ink); border:1px solid #DFD5C6;
    border-radius:var(--r-md); padding:.6rem 1rem; font-size:1rem; text-align:right;
    line-height:1.5; font-weight:600; box-shadow:var(--sh-1); }
  .pick button:hover { filter:none; border-color:var(--green); box-shadow:var(--sh-2); }
  .pick button .v { display:block; font-size:.85rem; color:var(--ink-soft); font-weight:400;
    margin-top:.1rem; }
  .pick button.on { border-color:var(--green); color:#F7F2E9;
    background:linear-gradient(150deg,var(--green),var(--green-deep));
    box-shadow:0 3px 10px rgba(18,59,45,.24); }
  .pick button.on .v { color:#D8E7DF; }
  .pick button:disabled { opacity:.4; }
  .counter { position:sticky; top:0; z-index:5; background:var(--brass-soft);

/* مفتاح التخزين يُرفع مع كل تغيير جوهري في الأسئلة.
   حالة قديمة قد تحمل صفاتٍ حُذفت (rSmoke، rDriving) فتُحسب ضمن الشروط الحاسمة
   وهي غير معروضة أصلاً — فيمتلئ الحد الأقصى بشروطٍ لا يراها صاحبها. */
const LS_KEY = "spike2a_v16";
let lastAnimatedStep = null;

/* ── حجم الخط: يكبّره من يحتاج، ويُحفظ على الجهاز ── */
const FS_KEY = "spike2a_fontsize";
const FS_MIN = 16, FS_MAX = 24, FS_STEP = 2;
function applyFontSize(px){
  const v = Math.min(FS_MAX, Math.max(FS_MIN, px|0));
  document.documentElement.style.fontSize = v + "px";
  try { localStorage.setItem(FS_KEY, String(v)); } catch {}
  const lbl = document.querySelector(".fontctl .lbl");
  if (lbl) lbl.textContent = Math.round(v / FS_MIN * 100) + "٪";
  return v;
}
function currentFontSize(){
  const raw = parseInt(localStorage.getItem(FS_KEY) || "", 10);
  return isNaN(raw) ? FS_MIN : Math.min(FS_MAX, Math.max(FS_MIN, raw));
}
function buildFontControl(){
  const box = document.createElement("div");
  box.className = "fontctl noprint";
  const mk = (txt, title, delta) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = txt; b.title = title;
    b.addEventListener("click", () => applyFontSize(currentFontSize() + delta));
    return b;
  };
  box.appendChild(mk("ﺃ−", "تصغير الخط", -FS_STEP));
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  box.appendChild(lbl);
  box.appendChild(mk("ﺃ+", "تكبير الخط", +FS_STEP));
  document.body.appendChild(box);
  applyFontSize(currentFontSize());
}

/* ── شروط حاسمة مجمّعة: عدة صفات متقاربة تُحسب شرطاً واحداً ──
   طلب محمد: الذهب والوشم والتدخين والكحول والمخدرات يمكن أن تكون
   شرطاً حاسماً واحداً من الثمانية، لا أربعة تلتهم نصف الحد. */
const DB_BUNDLES = [

    members:["rTobacco","rIntox","rJewelry","rTattoo"],

let state = { answers:{}, imp:{}, section:0, timings:{}, enteredAt:Date.now(), startedAt:Date.now(), feedback:{}, started:false, finished:false, stepKey:null };
/* الإجاباتُ المحفوظة تُحمَّل دائماً، ويُسأل صاحبها في صفحةٍ هادئة لا في نافذة نظام.
   القديم كان يحذف كل إجاباته بمجرّد ضغطة «لا» على نافذةٍ تظهر قبل أن يرى الصفحة. */
let askResume = false;

  const saved = JSON.parse(localStorage.getItem(LS_KEY));
  if (saved && saved.started){ state = saved; askResume = true; }
} catch {}

const app = document.getElementById("app");

  (!f.g || (f.g==="M"&&genderOf()==="ذكر") || (f.g==="F"&&genderOf()==="أنثى")) &&
  (!f.if || f.if(state.answers)));
/* تُحسب درجات الأهمية للصفات المعروضة الآن فقط — لا لصفةٍ حُذفت أو لا تخص جنس المستخدم.
   وإلا امتلأ حد الشروط الحاسمة بشروطٍ لا يراها صاحبها ولا يستطيع رفعها. */
const impOfVisibleReqs = () => {
  const sec = SECTIONS.find(s => s.id === "reqs");
  return sec ? visibleFields(sec).map(f => state.imp[f.id]) : [];
};
/* الشروط الحاسمة المعروضة الآن، وكل حزمة منها تُعدّ واحداً */
function dbUnits(){
  const sec = SECTIONS.find(s => s.id === "reqs");
  if (!sec) return [];
  const ids = visibleFields(sec).filter(f => state.imp[f.id] === "شرط حاسم").map(f => f.id);
  const units = [], seen = new Set();
  for (const id of ids){
    const b = bundleOf(id);
    if (b){ if (!seen.has(b.id)){ seen.add(b.id); units.push(b.id); } }
    else units.push(id);
  }
  return units;
}
const dbCount = () => dbUnits().length;
const setCriteria = () => impOfVisibleReqs().filter(v => v && v !== "لا يهم").length;
const kidsN = () => { const c = state.answers.kidsCount || ""; return Math.min(parseInt(c) || 0, 7); };

function visNoteText(f, sec){
  const vis = f.vis || sec.vis || SECTION_VIS[sec.id] || "match";
  const why = f.why ? ("لماذا نسأل: " + f.why + "\n") : "";
  return why + (VIS_TEXT[vis] || "");
}

// قسمٌ مكتمل: كل حقوله المرئية مُجابة (النصوص اختيارية)، ودرجات الأهمية محددة
function isSectionComplete(sec){
  for (const f of visibleFields(sec)){
    if (f.t === "text") continue;
    if (f.t === "multi"){
      if (f.req){
        const v = state.answers[f.id];
        if (!Array.isArray(v) || !v.length) return false;
      }
      continue;
    }
    if (f.t === "range"){ continue; }
    if (f.t === "kidages"){
      const n = kidsN();
      for (let i = 1; i <= n; i++) if (!state.answers[`kidAge_${i}`]) return false;
      continue;
    }
    if (!state.answers[f.id]) return false;
  }
  return true;
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function makeSelect(options, value, onchange){
  const s = el("select");
  const first = el("option", null, "اختر...");
  first.value = "";
  s.appendChild(first);
  for (const o of options){
    const opt = el("option", null, o);
    if (o === value) opt.selected = true;
    s.appendChild(opt);
  }
  s.addEventListener("change", onchange);
  return s;
}
function makeInput(type, value, attrs, onchange){
  const i = el("input");
  i.type = type;
  if (value !== undefined && value !== null && value !== "") i.value = value;
  for (const k in attrs) i.setAttribute(k, attrs[k]);
  i.addEventListener("change", onchange);
  return i;
}
function buildLabel(h, w){
  if (!h || !w) return "";
  const bmi = w / Math.pow(h/100, 2);
  if (bmi < 18.5) return "نحيف";
  if (bmi < 25) return "متناسق";
  if (bmi < 30) return "ممتلئ قليلاً";
  return "ممتلئ";
}

    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (typeof data.version !== "string" || !data.version.startsWith("spike2a")){
          alert("هذا الملف ليس ملف إجابات صالحاً"); return;
        }
        state = { answers:data.answers??{}, imp:data.imp??{}, section:0,
          timings:data.timings??{}, enteredAt:Date.now(), startedAt:Date.now(),
          feedback:data.feedback??{}, started:true, finished:false,
          stepKey:data.stepKey??null, card:data.card??null };
        save();
        renderImportChoice(data.stepKey);
      } catch { alert("تعذر قراءة الملف"); }
    };
    reader.readAsText(file);
  });
  impBtn.addEventListener("click", () => fileIn.click());
  impWrap.appendChild(impBtn);
  impWrap.appendChild(fileIn);
  impWrap.appendChild(el("div", "help", "أكملت جزءاً على جهاز آخر؟ استورد ملف JSON الذي نزّلته لتكمل من حيث توقفت."));
  return impWrap;
}

// هل أُجيب عن هذا السؤال؟ (المدى يُخزَّن في حقلين)
function isAnswered(f){
  if (f.t === "range") return state.answers[f.id+"_min"] != null && state.answers[f.id+"_max"] != null;
  const v = state.answers[f.id];
  return Array.isArray(v) ? v.length > 0 : (v != null && v !== "");
}
// من موضع توقفه فصاعداً: أول سؤال بلا إجابة — حتى لا نعيده لسؤال أجاب عنه،
// ولا نرجعه لسؤال اختياري تخطّاه في أول الطريق
function resumeStep(saved){
  const steps = askableSteps();
  const idx = saved ? steps.findIndex(s => s.f.id === saved) : -1;
  if (idx >= 0){
    const fwd = steps.slice(idx).find(s => !isAnswered(s.f));
    return (fwd || steps[idx]).f.id;
  }
  const gap = steps.find(s => !isAnswered(s.f));
  return (gap || steps[steps.length-1]).f.id;
}

// بعد الاستيراد: نترك الاختيار له — تقارير، أو إكمال، أو مراجعة من البداية
function renderImportChoice(savedStep){
  app.replaceChildren();
  const box = el("div");
  box.appendChild(el("h1", null, "تم استيراد إجاباتك"));

  const steps = askableSteps();

  box.appendChild(el("p", "muted",
    `استعدنا إجاباتك المحفوظة (${done} من ${steps.length} سؤالاً). أين تحب أن تبدأ؟`));

  const opt = (label, help, sec, apply) => {
    const w = el("div", "fg");
    const b = el("button", sec ? "sec" : null, label);
    b.addEventListener("click", () => {
      apply(); state.enteredAt = Date.now(); save(); render(); window.scrollTo(0,0);
    });
    w.appendChild(b);
    w.appendChild(el("div", "help", help));
    box.appendChild(w);
  };

  opt("عرض التقارير (مرآتك وبطاقتك) 📊",
      "اذهب مباشرةً إلى النتيجة: أثقل ما تبحث عنه، ووقفتك مع نفسك، وبطاقة التعريف.",
      false, () => { state.finished = true; });

  opt("المتابعة من حيث توقفت ▶",
      "يفتح عند أول سؤال لم تجب عنه بعد.",
      true, () => { state.finished = false; state.stepKey = resumeStep(savedStep); });

  opt("المراجعة والتعديل من البداية ✎",
      "يمرّ بك على كل الأسئلة من أولها لتراجع إجاباتك وتعدّل ما تشاء.",
      true, () => { state.finished = false; state.stepKey = steps[0].f.id; });

  app.appendChild(box);
  window.scrollTo(0,0);
}

// يبني عنصر حقل واحد كاملاً (يُعاد استخدامه). advance اختياري للانتقال التلقائي.
function renderOneField(sec, f, dbBox, advance){
  const fg = el("div", "fg");
  fg.dataset.fid = f.id;
  const lblRow = el("label", null, f.l);
  // ملاحظة «من يرى هذه المعلومة» أُزيلت: لا وجود لطرف آخر ولا لمراحل كشف في هذه النسخة،
  // فكانت تَعِد بما لا يقع. يبقى «لماذا نسأل» حيث يفيد. (قرار محمد 2026-07-28)
  if (f.why){
    const info = el("span", "info", "ⓘ");
    info.title = "لماذا نسأل هذا السؤال";
    lblRow.appendChild(info);
    fg.appendChild(lblRow);
    const note = el("div", "note", "لماذا نسأل: " + f.why);
    note.style.display = "none";
    info.addEventListener("click", () => { note.style.display = note.style.display === "none" ? "block" : "none"; });
    fg.appendChild(note);
  } else {
    fg.appendChild(lblRow);
  }
  if (f.h) fg.appendChild(el("div", "help", f.h));
  const clearMissing = () => fg.classList.remove("missing");
  // المتابعة التلقائية: السؤال المفرد ينتقل فور الإجابة — بلا استثناء.
  // أما المجموعة فتُعاد رسمها ليظهر ما يتوقف على الإجابة، وينتقل بضغطة «التالي».
  // عدد أسئلة البطاقة الحالية — يتغيّر إن كشفت الإجابة سؤالاً تابعاً
  const stepSize = () => {
    const st = askableSteps().find(x => x.f.id === state.stepKey);
    return st ? st.fields.length : 0;
  };
  const onAnswer = (e) => {
    const before = stepSize();
    const v = e.target.value;
    state.answers[f.id] = v; clearMissing();
    if (f.req){
      if (NO_PREF.has(v)) state.imp[f.id] = "لا يهم";
      else if (state.imp[f.id] === "لا يهم") delete state.imp[f.id];
    }
    save();
    // إن فتحت الإجابةُ سؤالاً جديداً على البطاقة نفسها (كوصف الحالة الصحية)
    // فلا ننتقل — نبقى ليراه ويجيب عنه. هذا يسري على كل البطاقات بلا استثناء.
    if (stepSize() !== before){ render(); return; }
    if (advance) advance(); else render();
  };
  if (f.t === "select"){
    const opts = f.pnts ? [...optsOf(f), PNTS] : optsOf(f);
    fg.appendChild(makeSelect(opts, state.answers[f.id], onAnswer));
  } else if (f.t === "multi"){
    const wrap = el("div", "multi");
    const chosen = Array.isArray(state.answers[f.id]) ? state.answers[f.id] : [];
    for (const o of f.o){
      const lab = el("label");
      const cb = el("input"); cb.type = "checkbox"; cb.checked = chosen.includes(o);
      cb.addEventListener("change", () => {
        const cur = Array.isArray(state.answers[f.id]) ? state.answers[f.id] : [];
        let next = cb.checked ? [...cur, o] : cur.filter(x=>x!==o);
        // خيارات يُلغي اختيارها ما عداها (مثل «أرفضها جميعاً»)
        if (f.excl && cb.checked){
          next = f.excl.includes(o) ? [o] : next.filter(x => !f.excl.includes(x));
        }
        state.answers[f.id] = next;
        save(); clearMissing();
        if (f.excl) render();
      });
      lab.appendChild(cb); lab.appendChild(el("span", null, o));
      wrap.appendChild(lab);
    }
    fg.appendChild(wrap);
  } else if (f.t === "slider"){
    const wrap = el("div", "single");
    const readout = el("div", "hint", state.answers[f.id] ? sliderText(f) : "حرّك المؤشر لاختيار القيمة");
    const r = makeInput("range", state.answers[f.id] ?? Math.round((f.min+f.max)/2), {min:f.min, max:f.max}, ()=>{});
    r.addEventListener("input", (e) => {
      state.answers[f.id] = e.target.value; save(); clearMissing();
      readout.textContent = sliderText(f);
      const hint = document.getElementById("bmiHint");
      if (hint) hint.textContent = bmiText();
    });
    wrap.appendChild(r); wrap.appendChild(readout); fg.appendChild(wrap);
    if (f.bmi){ const hint = el("div", "hint", bmiText()); hint.id = "bmiHint"; fg.appendChild(hint); }
  } else if (f.t === "dob"){
    // ثلاث قوائم بدل كتابة التاريخ — أيسر بكثير على من لا يألف لوحة المفاتيح
    const cur = (state.answers[f.id] || "").split("-");   // YYYY-MM-DD
    const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو",
                    "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    const nowY = new Date().getFullYear();
    const years = []; for (let y = nowY - 18; y >= nowY - 75; y--) years.push(String(y));
    const days  = []; for (let d = 1; d <= 31; d++) days.push(String(d));
    const box = el("div", "dob");
    const pick = (arr, val, ph, on) => {
      const sel = el("select");
      const first = el("option", null, ph); first.value = ""; sel.appendChild(first);
      arr.forEach((o, idx) => {
        const opt = el("option", null, o);
        opt.value = (arr === MONTHS) ? String(idx + 1) : o;
        if (opt.value === val) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", on);
      return sel;
    };
    const pad = n => String(n).padStart(2, "0");
    const parts = { d: cur[2] ? String(+cur[2]) : "", m: cur[1] ? String(+cur[1]) : "", y: cur[0] || "" };
    const commit = () => {
      state.answers[f.id] = (parts.y && parts.m && parts.d)
        ? `${parts.y}-${pad(parts.m)}-${pad(parts.d)}` : "";
      clearMissing(); save();
      const hint = fg.querySelector(".dobAge");
      if (hint){ const a = ownAge(); hint.textContent = a ? `العمر: ${a} سنة` : ""; }
    };
    box.appendChild(pick(days,   parts.d, "اليوم",  e => { parts.d = e.target.value; commit(); }));
    box.appendChild(pick(MONTHS, parts.m, "الشهر",  e => { parts.m = e.target.value; commit(); }));
    box.appendChild(pick(years,  parts.y, "السنة",  e => { parts.y = e.target.value; commit(); }));
    fg.appendChild(box);
    const a0 = ownAge();
    fg.appendChild(el("div", "hint dobAge", a0 ? `العمر: ${a0} سنة` : ""));
  } else if (f.t === "text"){
    fg.appendChild(makeInput("text", state.answers[f.id], {}, onAnswer));
  } else if (f.t === "kidages"){
    const n = kidsN();
    for (let i = 1; i <= n; i++){
      const row = el("div", "kidrow");
      row.appendChild(el("span", null, `عمر الابن/الابنة ${i}`));
      row.appendChild(makeInput("number", state.answers[`kidAge_${i}`], {min:0, max:45},
        e => { state.answers[`kidAge_${i}`] = e.target.value; save(); clearMissing(); }));
      fg.appendChild(row);
    }
    if ((state.answers.kidsCount||"") === "7+") fg.appendChild(el("div", "help", "يكفي إدخال أعمار السبعة الأكبر"));
  } else if (f.t === "range"){
    const loKey = f.id+"_min", hiKey = f.id+"_max";
    if (!state.answers[loKey]) state.answers[loKey] = String(f.lo);
    if (!state.answers[hiKey]) state.answers[hiKey] = String(f.hi);
    const dual = el("div", "dual");
    const track = el("div", "track"); const fillseg = el("div", "fillseg");
    dual.appendChild(track); dual.appendChild(fillseg);
    const readout = el("div", "hint", rangeText(f));
    const pct = v => (v - f.min) / (f.max - f.min) * 100;
    const paint = () => { const lo=+state.answers[loKey], hi=+state.answers[hiKey]; fillseg.style.right=pct(lo)+"%"; fillseg.style.width=Math.max(0,pct(hi)-pct(lo))+"%"; };
    // المقبضان لا يتقاطعان: كلٌّ يقف عند الآخر بدل أن تُبدَّل القيمتان تحت الإصبع
    const mk = (key) => {
      const r = makeInput("range", state.answers[key], {min:f.min, max:f.max}, ()=>{});
      r.addEventListener("pointerdown", () => {
        dual.querySelectorAll("input").forEach(x => x.style.zIndex = "1");
        r.style.zIndex = "3";
      });
      r.addEventListener("input", (e) => {
        let v = +e.target.value;
        const lo = +state.answers[loKey], hi = +state.answers[hiKey];
        if (key === loKey) v = Math.min(v, hi);       // الأدنى لا يتجاوز الأعلى
        else               v = Math.max(v, lo);       // والأعلى لا ينزل تحت الأدنى
        state.answers[key] = String(v);
        e.target.value = String(v);                   // ردّ القيمة المقيَّدة للمقبض نفسه
        readout.textContent = rangeText(f); paint(); save();
      });
      return r;
    };
    dual.appendChild(mk(loKey)); dual.appendChild(mk(hiKey)); paint();
    fg.appendChild(dual); fg.appendChild(readout);
  }
  // درجة الأهمية لم تعد تُسأل هنا — صارت شاشتَي ترتيب الأولويات في النهاية،
  // فذلك أسرع، ويجبر على المفاضلة بدل أن يوسم كل شيء بأنه «أساسي» (قرار محمد 2026-07-28)
  if (f.req){
    const val = state.answers[f.id];
    if (val && NO_PREF.has(val)) state.imp[f.id] = "لا يهم";
  }
  return fg;
}

// خطوة واحدة = سؤال واحد، أو مجموعة أسئلة قصيرة تحمل الوسم نفسه (grp)
function askableSteps(){
  const out = [];
  for (const sec of SECTIONS){
    const vis = visibleFields(sec);
    let i = 0;
    while (i < vis.length){
      const g = vis[i].grp;
      if (g){
        const fields = [];
        while (i < vis.length && vis[i].grp === g){ fields.push(vis[i]); i++; }
        out.push({ sec, fields, f: fields[0], grp: g });
      } else {
        out.push({ sec, fields:[vis[i]], f: vis[i], grp: null });
        i++;
      }
    }
  }
  return out;
}

function fieldError(f){
  if (f.t === "text") return null;
  if (f.t === "multi"){
    if (!f.req) return null;                       // الاختيارات المتعددة الاختيارية (كاللغات) تبقى بلا إلزام
    const v = state.answers[f.id];
    if (!Array.isArray(v) || !v.length) return "اختر إجابة واحدة على الأقل";
    return null;
  }
  if (f.t === "range"){
    const lo=+state.answers[f.id+"_min"], hi=+state.answers[f.id+"_max"];
    if (lo && hi && lo>hi) return "النطاق غير صحيح";
    if (f.id==="rAge" && lo && lo<18) return "الحد الأدنى للعمر ثمانية عشر عاماً";
    return null;
  }
  if (f.t === "slider") return state.answers[f.id] ? null : "حرّك المؤشر لاختيار القيمة";
  if (f.t === "kidages"){ const n=kidsN(); for(let i=1;i<=n;i++) if(!state.answers[`kidAge_${i}`]) return "أكمل أعمار الأولاد"; return null; }
  if (!state.answers[f.id]) return "من فضلك أجب هذا السؤال";
  if (f.id==="dob"){ const age=(Date.now()-new Date(state.answers.dob).getTime())/31557600000; if(!(age>=18)) return "التسجيل لمن أتم الثامنة عشرة فقط"; }
  return null;
}

function accTime(secId){ state.timings[secId] = (state.timings[secId]||0) + Math.round((Date.now()-state.enteredAt)/1000); state.enteredAt = Date.now(); }

function renderChat(){
  app.replaceChildren();
  const steps = askableSteps();
  if (!steps.length) return;
  let idx = steps.findIndex(s => s.f.id === state.stepKey);
  if (idx < 0) idx = 0;
  const step = steps[idx], sec = step.sec, fields = step.fields;
  const single = fields.length === 1;

  // بلا ترويسة مكررة ولا عدّ للأسئلة — كلاهما يُثقل الشاشة بلا فائدة (قرار محمد 2026-07-28)
  const tagRow = el("div", "taprow");
  tagRow.appendChild(el("span", "tag", "نسخة تجريبية"));
  app.appendChild(tagRow);
  const bar=el("div","bar"); const fill=el("div"); fill.style.width=Math.round(idx/steps.length*100)+"%"; bar.appendChild(fill); app.appendChild(bar);

  // الحركة مرة واحدة عند الوصول للسؤال، لا كلما أُعيد الرسم بسبب إجابة داخل البطاقة
  const wrap = el("div", "qwrap" + (lastAnimatedStep === state.stepKey ? "" : " anim"));
  lastAnimatedStep = state.stepKey;
  const firstOfSec = idx===0 || steps[idx-1].sec.id !== sec.id;
  const hasBridge = firstOfSec && BRIDGES[sec.id];
  if (hasBridge) wrap.appendChild(el("div","bubble bridge", BRIDGES[sec.id]));
  // سؤال مفرد: يظهر نصه دائماً. مجموعة: لا نكرّر صوت القسم — الجسر يكفي في أول بطاقة.
  // عنوان البطاقة يأخذ خلفية مميزة دائماً — رئيسياً كان أو فرعياً — كي لا تُخطئه العين سؤالاً
  if (single) wrap.appendChild(el("div","bubble", fields[0].q || fields[0].l));
  else if (!hasBridge) wrap.appendChild(el("div","bubble sub", GRP_Q[step.grp] || sec.title));

  const err = el("p","error");
  // سؤال واحد ← تقدّم تلقائي؛ مجموعة ← ينتقل بضغطة «التالي» بعد أن يجيب عنها كلها
  for (const f of fields){
    const fg = renderOneField(sec, f, null, single ? () => goNext() : null);
    // السؤال ظاهر في الفقاعة، فيُخفى نص العنوان — لكن تبقى ⓘ «لماذا نسأل» في متناوله
    if (single){
      const lbl = fg.querySelector("label");
      if (lbl){
        const info = lbl.querySelector(".info");
        if (info){ lbl.textContent = ""; lbl.appendChild(info); lbl.style.marginBottom = ".2rem"; }
        else lbl.style.display = "none";
      }
    }
    wrap.appendChild(fg);
  }

  wrap.appendChild(err);
  const nav = el("div","nav");
  if (idx>0){
    const back = el("button","sec","السابق");
    back.addEventListener("click", ()=>{ accTime(sec.id); state.stepKey = steps[idx-1].f.id; save(); render(); window.scrollTo(0,0); });
    nav.appendChild(back);
  }
  const last = idx===steps.length-1;
  const next = el("button", null, last ? "تم" : "التالي");
  next.addEventListener("click", ()=>{
    for (const f of fields){
      const e = fieldError(f);
      if (e){
        err.textContent = e;
        const box = wrap.querySelector(`.fg[data-fid="${f.id}"]`); if (box) box.classList.add("missing");
        return;
      }
    }
    goNext();
  });
  nav.appendChild(next);
  wrap.appendChild(nav);
  app.appendChild(wrap);
}

function goNext(){
  const steps = askableSteps();
  let idx = steps.findIndex(s=>s.f.id===state.stepKey);
  if (idx<0) idx=0;
  const step = steps[idx], secId = step.sec.id;
  for (const f of step.fields){
    const e = fieldError(f);
    if (e){
      render();
      const box=document.querySelector(`.fg[data-fid="${f.id}"]`); if(box) box.classList.add("missing");
      const ep=document.querySelector(".error"); if(ep) ep.textContent=e;
      return;
    }
  }
  accTime(secId);
  if (idx >= steps.length-1){
    // انتهت الأسئلة — تبدأ لحظة ترتيب الأولويات، لا النهاية
    if (chosenCriteria().length < MIN_CRITERIA){
      alert(`اختر ${ar(MIN_CRITERIA)} صفات على الأقل تهمّك (غير «لا يهم») حتى يعمل التوافق.`); return;
    }
    state.phase = "db"; save(); render(); window.scrollTo(0,0); return;
  }
  state.stepKey = steps[idx+1].f.id; save(); render(); window.scrollTo(0,0);
}

/* ============================================================
   لحظة ترتيب الأولويات — شاشتان باللمس بدل أن يُسأل عن أهمية
   كل صفة على حدة. المفاضلة نفسها هي ما يُعرِّف المرء بنفسه.
   ============================================================ */

// الصفات التي اختار لها قيمة فعلية (بلا اعتبار للأهمية بعد)
// أرقام عربية-هندية داخل الجُمل العربية
const ar = (n) => String(n).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[+d]);

function chosenCriteria(){
  const sec = REQ_SEC(); if (!sec) return [];
  return visibleFields(sec).map(f => {
    const v = clean(reqValue(f.id));
    return { id:f.id, label:clean(f.short || f.l), value:v };
  }).filter(c => c.value && !NO_PREF.has(c.value));
}

function renderPrioritize(){
  app.replaceChildren();
  const all = chosenCriteria();
  const isDb  = (id) => state.imp[id] === "شرط حاسم";
  const isEss = (id) => state.imp[id] === "أساسي";
  const phase = state.phase;                       // "db" ثم "essential"
  const pool  = phase === "db" ? all : all.filter(c => !isDb(c.id));

  const h1 = el("h1", null, phase === "db" ? "وقفة قصيرة قبل النهاية " : "وما الذي يهمك كثيراً؟ ");
  h1.appendChild(el("span","tag","نسخة تجريبية"));
  app.appendChild(h1);

  const bar = el("div","bar"); const fill = el("div");
  fill.style.width = (phase === "db" ? 92 : 97) + "%"; bar.appendChild(fill); app.appendChild(bar);

  const wrap = el("div","qwrap");
  wrap.appendChild(el("div","bubble bridge",
    phase === "db"
      ? `اخترت ${ar(all.length)} صفة تريدها في شريك حياتك، وكلها طيبة. لكن الحياة لا تعطي كل شيء.`
      : "بقي أمر واحد."));
  wrap.appendChild(el("div","bubble",
    phase === "db"
      ? `فما الذي لا تقبل الزواج بدونه إطلاقاً؟ اختر ما تحب حتى ${ar(DB_CAP)} كحد أقصى.`
      : "وما الذي يهمك كثيراً وإن لم يكن شرطاً لا تتنازل عنه؟ اختر ما شئت، وما تتركه يبقى مرغوباً لا أكثر."));

  let counter = null;
  if (phase === "db"){
    counter = el("div", "counter");
    wrap.appendChild(counter);
  }
  const paint = () => {
    if (!counter) return;
    const n = dbCount();
    counter.textContent = `اخترت ${ar(n)} من ${ar(DB_CAP)}`;
    counter.className = "counter" + (n >= DB_CAP ? " full" : "");
  };

  const pick = el("div","pick");

  /* في شاشة الشروط الحاسمة تُعرض الحزمة رقاقةً واحدة، فتُحسب واحداً من الثمانية.
     أما في شاشة «الأساسي» فتبقى كل صفة على حدة — لا حدّ هناك. */
  const bundlesShown = new Set();
  if (phase === "db"){
    for (const bun of DB_BUNDLES){
      const mine = pool.filter(c => bun.members.includes(c.id));
      if (mine.length < 2) continue;                 // حزمة بصفة واحدة ليست حزمة
      bundlesShown.add(bun.id);
      mine.forEach(c => c.__inBundle = true);
      const b = el("button");
      b.appendChild(document.createTextNode(bun.label));
      b.appendChild(el("span","v", mine.map(c => c.label).join(" · ")));
      const on = () => mine.some(c => isDb(c.id));
      const sync = () => { b.className = on() ? "on" : ""; };
      sync();
      b.addEventListener("click", () => {
        if (on()) mine.forEach(c => { state.imp[c.id] = "مفضل"; });
        else {
          if (dbCount() >= DB_CAP){
            alert(`وصلت للحد الأقصى: ${ar(DB_CAP)} شروط حاسمة. خفّف شرطاً آخر أولاً.`); return;
          }
          mine.forEach(c => { state.imp[c.id] = "شرط حاسم"; });
        }
        save(); sync(); paint();
      });
      pick.appendChild(b);
    }
  }

  for (const c of pool){
    if (c.__inBundle) continue;
    const b = el("button");
    b.appendChild(document.createTextNode(c.label));
    b.appendChild(el("span","v", c.value));
    const on = () => phase === "db" ? isDb(c.id) : isEss(c.id);
    const sync = () => { b.className = on() ? "on" : ""; };
    sync();
    b.addEventListener("click", () => {
      if (phase === "db"){
        if (isDb(c.id)) state.imp[c.id] = "مفضل";
        else {
          if (dbCount() >= DB_CAP){
            alert(`وصلت للحد الأقصى: ${ar(DB_CAP)} شروط حاسمة. خفّف شرطاً آخر أولاً.`); return;
          }
          state.imp[c.id] = "شرط حاسم";
        }
      } else {
        state.imp[c.id] = isEss(c.id) ? "مفضل" : "أساسي";
      }
      save(); sync(); paint();
    });
    pick.appendChild(b);
  }
  paint();
  wrap.appendChild(pick);

  const nav = el("div","nav");
  const back = el("button","sec","السابق");
  back.addEventListener("click", () => {
    if (phase === "essential"){ state.phase = "db"; }
    else {
      const steps = askableSteps();
      state.phase = null; state.stepKey = steps[steps.length-1].f.id;
    }
    save(); render(); window.scrollTo(0,0);
  });
  nav.appendChild(back);

  const next = el("button", null, phase === "db" ? "التالي" : "اعرض النتيجة");
  next.addEventListener("click", () => {
    if (phase === "db"){ state.phase = "essential"; save(); render(); window.scrollTo(0,0); return; }
    // ما لم يُختر يبقى «مفضل» — رغبة صادقة بلا إلزام
    for (const c of all) if (!state.imp[c.id]) state.imp[c.id] = "مفضل";
    state.phase = null; state.finished = true; save(); render(); window.scrollTo(0,0);
  });
  nav.appendChild(next);
  wrap.appendChild(nav);

  if (phase === "db")
    wrap.appendChild(el("p","muted","لك أن تترك الكل بلا شرط حاسم — الانفتاح ليس عيباً."));
  app.appendChild(wrap);
}

// شاشة العودة — بديلة عن نافذة النظام، ولا تحذف شيئاً إلا بطلبٍ صريح مرتين
function renderResume(){
  app.replaceChildren();
  const box = el("div");
  const steps = askableSteps();
  const done = steps.filter(s => s.fields.every(f => isAnswered(f) || f.t === "text")).length;

  box.appendChild(el("h1", null, "أهلاً بعودتك"));
  box.appendChild(el("p", "muted",
    `وجدنا إجاباتك المحفوظة على هذا الجهاز (${ar(done)} من ${ar(steps.length)} بطاقة). أين تحب أن تبدأ؟`));

  const opt = (label, help, sec, apply) => {
    const w = el("div", "fg");
    const b = el("button", sec ? "sec" : null, label);
    b.addEventListener("click", () => { apply(); askResume = false; render(); window.scrollTo(0,0); });
    w.appendChild(b); w.appendChild(el("div", "help", help));
    box.appendChild(w);
  };

  opt("المتابعة من حيث توقفت ▶", "يفتح عند أول سؤال لم تجب عنه بعد.", false, () => {
    state.finished = false; state.phase = null; state.stepKey = resumeStep(state.stepKey);
  });
  if (chosenCriteria().length >= MIN_CRITERIA)
    opt("عرض التقارير (مرآتك وبطاقتك) 📊", "اذهب مباشرةً إلى النتيجة.", true, () => {
      state.finished = true; state.phase = null;
    });
  opt("المراجعة من البداية ✎", "يمرّ بك على كل الأسئلة لتراجع إجاباتك.", true, () => {
    state.finished = false; state.phase = null; state.stepKey = steps[0].f.id;
  });

  // الحذف يحتاج ضغطتين — لا يضيع مجهود أحد بضغطةٍ واحدة
  const wipe = el("div", "fg");
  const wb = el("button", "sec", "البدء من جديد ومسح إجاباتي");
  let armed = false;
  wb.addEventListener("click", () => {
    if (!armed){ armed = true; wb.textContent = "اضغط مرة أخرى للتأكيد — سيُمسح كل شيء"; wb.style.borderColor = "#D9A79F"; return; }
    localStorage.removeItem(LS_KEY);
    state = { answers:{}, imp:{}, section:0, timings:{}, enteredAt:Date.now(), startedAt:Date.now(),
              feedback:{}, started:false, finished:false, stepKey:null };
    askResume = false; render(); window.scrollTo(0,0);
  });
  wipe.appendChild(wb);
  wipe.appendChild(el("div", "help", "لا يُمسح شيء إلا بعد تأكيدك مرتين."));
  box.appendChild(wipe);
  app.appendChild(box);
}

function render(){
  if (askResume) return renderResume();
  if (!state.started) return renderWelcome();
  if (state.finished) return renderDone();
  if (state.phase) return renderPrioritize();
  return renderChat();
}

function renderSectionLegacy(){
  const sec = SECTIONS[state.section];
  if (!sec) return renderDone();
  app.replaceChildren();

  const h1 = el("h1", null, "استبيان الزواج ");
  h1.appendChild(el("span", "tag", "نسخة تجريبية"));
  app.appendChild(h1);
  const pctDone = Math.round(state.section / SECTIONS.length * 100);
  app.appendChild(el("p", "muted", `القسم ${state.section+1} من ${SECTIONS.length} — أكملت ${pctDone}٪`));
  const bar = el("div", "bar"); const fill = el("div");
  fill.style.width = pctDone + "%";
  bar.appendChild(fill); app.appendChild(bar);
  app.appendChild(el("h2", null, sec.title));
  if (sec.intro) app.appendChild(el("p", "muted", sec.intro));

  // التنقل بين الأقسام — للمراجعة والتعديل في أي وقت
  {
    const navWrap = el("div", "fg");
    navWrap.appendChild(el("label", null, "التنقل بين الأقسام (للمراجعة والتعديل)"));
    const jump = el("select");
    SECTIONS.forEach((s, i) => {
      const done = isSectionComplete(s);
      const opt = el("option", null, `${i+1}. ${s.title}${done ? " ✓" : ""}`);
      opt.value = String(i);
      if (i === state.section) opt.selected = true;
      jump.appendChild(opt);
    });
    jump.addEventListener("change", (e) => {
      recordTiming(sec.id);
      state.section = +e.target.value; state.enteredAt = Date.now(); save(); render(); window.scrollTo(0,0);
    });
    navWrap.appendChild(jump);
    app.appendChild(navWrap);
  }

  let dbBox = null;
  if (sec.id === "reqs"){
    dbBox = el("div", "db" + (dbCount()>=DB_CAP ? " full" : ""), `شروطك الحاسمة: ${dbCount()} من ${DB_CAP}`);
    app.appendChild(dbBox);
  }

  for (const f of visibleFields(sec)){
    const fg = el("div", "fg");
    fg.dataset.fid = f.id;
    // سطر العنوان مع زر معلومات (لماذا نسأل / من يراها ومتى)
    const lblRow = el("label", null, f.l);
    const info = el("span", "info", "ⓘ");
    info.title = "لماذا نسأل / من يرى هذه المعلومة";
    lblRow.appendChild(info);
    fg.appendChild(lblRow);
    const note = el("div", "note", visNoteText(f, sec));
    note.style.display = "none";
    info.addEventListener("click", () => {
      note.style.display = note.style.display === "none" ? "block" : "none";
    });
    fg.appendChild(note);
    if (f.h) fg.appendChild(el("div", "help", f.h));
    const clearMissing = () => fg.classList.remove("missing");
    const onAnswer = (e) => {
      state.answers[f.id] = e.target.value; save(); clearMissing();
      if (RERENDER_ON.has(f.id)) render();
    };
    if (f.t === "select"){
      const opts = f.pnts ? [...optsOf(f), PNTS] : optsOf(f);
      // حقول الشروط: أي تغيير يُعيد الرسم لإظهار/إخفاء سؤال الأهمية والحقول المرتبطة
      const handler = f.req
        ? (e) => { state.answers[f.id] = e.target.value; save(); clearMissing(); render(); }
        : onAnswer;
      fg.appendChild(makeSelect(opts, state.answers[f.id], handler));
    } else if (f.t === "multi"){
      const wrap = el("div", "multi");
      const chosen = Array.isArray(state.answers[f.id]) ? state.answers[f.id] : [];
      for (const o of f.o){
        const lab = el("label");
        const cb = el("input"); cb.type = "checkbox"; cb.checked = chosen.includes(o);
        cb.addEventListener("change", () => {
          const cur = Array.isArray(state.answers[f.id]) ? state.answers[f.id] : [];
          state.answers[f.id] = cb.checked ? [...cur, o] : cur.filter(x=>x!==o);
          save(); clearMissing();
        });
        lab.appendChild(cb); lab.appendChild(el("span", null, o));
        wrap.appendChild(lab);
      }
      fg.appendChild(wrap);
    } else if (f.t === "slider"){
      const wrap = el("div", "single");
      const readout = el("div", "hint",
        state.answers[f.id] ? sliderText(f) : "حرّك المؤشر لاختيار القيمة");
      const r = makeInput("range", state.answers[f.id] ?? Math.round((f.min+f.max)/2), {min:f.min, max:f.max}, ()=>{});
      r.addEventListener("input", (e) => {
        state.answers[f.id] = e.target.value; save(); clearMissing();
        readout.textContent = sliderText(f);
        const hint = document.getElementById("bmiHint");
        if (hint) hint.textContent = bmiText();
      });
      wrap.appendChild(r);
      wrap.appendChild(readout);
      fg.appendChild(wrap);
      if (f.bmi){
        const hint = el("div", "hint", bmiText());
        hint.id = "bmiHint";
        fg.appendChild(hint);
      }
    } else if (f.t === "date"){
      fg.appendChild(makeInput("date", state.answers[f.id], {}, onAnswer));
    } else if (f.t === "text"){
      fg.appendChild(makeInput("text", state.answers[f.id], {}, onAnswer));
    } else if (f.t === "kidages"){
      const n = kidsN();
      for (let i = 1; i <= n; i++){
        const row = el("div", "kidrow");
        row.appendChild(el("span", null, `عمر الابن/الابنة ${i}`));
        row.appendChild(makeInput("number", state.answers[`kidAge_${i}`], {min:0, max:45},
          e => { state.answers[`kidAge_${i}`] = e.target.value; save(); clearMissing(); }));
        fg.appendChild(row);
      }
      if ((state.answers.kidsCount||"") === "7+")
        fg.appendChild(el("div", "help", "يكفي إدخال أعمار السبعة الأكبر"));
    } else if (f.t === "range"){
      const loKey = f.id+"_min", hiKey = f.id+"_max";
      if (!state.answers[loKey]) state.answers[loKey] = String(f.lo);
      if (!state.answers[hiKey]) state.answers[hiKey] = String(f.hi);
      const dual = el("div", "dual");
      const track = el("div", "track");
      const fillseg = el("div", "fillseg");
      dual.appendChild(track);
      dual.appendChild(fillseg);
      const readout = el("div", "hint", rangeText(f));
      const pct = v => (v - f.min) / (f.max - f.min) * 100;
      const paint = () => {
        const lo = +state.answers[loKey], hi = +state.answers[hiKey];
        // RTL: right side is min
        fillseg.style.right = pct(lo) + "%";
        fillseg.style.width = Math.max(0, pct(hi) - pct(lo)) + "%";
      };
      const mk = (key) => {
        const r = makeInput("range", state.answers[key], {min:f.min, max:f.max}, ()=>{});
        r.addEventListener("input", (e) => {
          state.answers[key] = e.target.value;
          let lo = +state.answers[loKey], hi = +state.answers[hiKey];
          if (lo > hi){ [state.answers[loKey], state.answers[hiKey]] = [String(hi), String(lo)]; }
          readout.textContent = rangeText(f);
          paint(); save();
        });
        return r;
      };
      dual.appendChild(mk(loKey));
      dual.appendChild(mk(hiKey));
      paint();
      fg.appendChild(dual);
      fg.appendChild(readout);
    }
    if (f.req){
      const val = state.answers[f.id];
      if (val && NO_PREF.has(val)){
        // اختار «بلا تفضيل» — لا نسأل عن الأهمية، ونضبطها ضمناً على «لا يهم»
        state.imp[f.id] = "لا يهم";
        fg.appendChild(el("div", "help", "اخترت «بلا تفضيل» لهذه الصفة، فلا حاجة لتحديد أهميتها."));
      } else {
        const impWrap = el("div", "imp");
        const impSel = el("select");
        const first = el("option", null, "ما مدى أهمية هذه الصفة لك؟");
        first.value = "";
        impSel.appendChild(first);
        for (const o of IMP){
          const opt = el("option", null, IMP_LABEL[o] || o);
          opt.value = o;
          if (o === state.imp[f.id]) opt.selected = true;
          impSel.appendChild(opt);
        }
        impSel.addEventListener("change", (e) => {
          if (e.target.value === "شرط حاسم" && state.imp[f.id] !== "شرط حاسم" && dbCount() >= DB_CAP){
            e.target.value = state.imp[f.id] ?? "";
            alert(`وصلت للحد الأقصى: ${DB_CAP} شروط حاسمة فقط. خفّف شرطاً آخر أولاً.`);
            return;
          }
          state.imp[f.id] = e.target.value; save(); fg.classList.remove("missing");
          if (dbBox){
            dbBox.textContent = `شروطك الحاسمة: ${dbCount()} من ${DB_CAP}`;
            dbBox.className = "db" + (dbCount()>=DB_CAP ? " full" : "");
          }
        });
        impWrap.appendChild(impSel);
        fg.appendChild(impWrap);
      }
    }
    app.appendChild(fg);
  }

  const err = el("p", "error");
  app.appendChild(err);
  const nav = el("div", "nav");
  if (state.section > 0){
    const back = el("button", "sec", "السابق");
    back.addEventListener("click", () => {
      recordTiming(sec.id); state.section--; state.enteredAt = Date.now(); save(); render(); window.scrollTo(0,0);
    });
    nav.appendChild(back);
  }
  const next = el("button", null, state.section === SECTIONS.length-1 ? "إنهاء" : "التالي");
  next.addEventListener("click", () => {
    const v = validate(sec);
    if (v){
      err.textContent = v.msg;
      document.querySelectorAll(".fg.missing").forEach(x => x.classList.remove("missing"));
      for (const id of v.ids){
        const box = document.querySelector(`.fg[data-fid="${id}"]`);
        if (box) box.classList.add("missing");
      }
      const firstBox = document.querySelector(".fg.missing");
      if (firstBox) firstBox.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    recordTiming(sec.id); state.section++; state.enteredAt = Date.now(); save(); render(); window.scrollTo(0,0);
  });
  nav.appendChild(next);
  app.appendChild(nav);
}

function sliderText(f){
  return `القيمة: ${state.answers[f.id]} ${f.unit ?? ""}`;
}
function bmiText(){
  const label = buildLabel(+state.answers.height, +state.answers.weight);
  return label ? `مؤشر تقريبي للقوام: ${label} (تقديري، وقد لا يعبر عن البنية الرياضية)` : "";
}
function rangeText(f){
  const lo = state.answers[f.id+"_min"], hi = state.answers[f.id+"_max"];
  let extra = "";
  if (f.id === "rWeight"){
    const h = (+state.answers.rHeight_min + +state.answers.rHeight_max)/2 || null;
    if (h){
      const a = buildLabel(h, +lo), b = buildLabel(h, +hi);
      if (a && b) extra = a===b ? ` — قوام تقريبي: ${a}` : ` — قوام تقريبي: من ${a} إلى ${b}`;
    }
  }
  return `من ${lo} إلى ${hi}${extra}`;
}

function recordTiming(id){ state.timings[id] = (state.timings[id]||0) + Math.round((Date.now()-state.enteredAt)/1000); }

function validate(sec){
  const ids = [];
  let msg = null;
  const flag = (id, m) => { ids.push(id); if (!msg) msg = m; };
  for (const f of visibleFields(sec)){
    if (f.t === "range"){
      const lo = +state.answers[f.id+"_min"], hi = +state.answers[f.id+"_max"];
      if (lo && hi && lo > hi) flag(f.id, `النطاق غير صحيح في: ${f.l}`);
      if (f.id === "rAge" && lo && lo < 18) flag(f.id, "الحد الأدنى للعمر ثمانية عشر عاماً");
      if (f.req && !state.imp[f.id]) flag(f.id, "حدد درجة الأهمية للشروط المظللة");
      continue;
    }
    if (f.t === "slider"){
      if (!state.answers[f.id]) flag(f.id, `حرّك المؤشر في: ${f.l}`);
      continue;
    }
    if (f.t === "kidages"){
      const n = kidsN();
      for (let i = 1; i <= n; i++)
        if (!state.answers[`kidAge_${i}`]) { flag(f.id, `أدخل أعمار الأولاد كاملة`); break; }
      continue;
    }
    if (f.t === "text" || f.t === "multi"){ continue; } // اختيارية
    if (!state.answers[f.id]){ flag(f.id, `أكمل الحقول المظللة`); continue; }
    if (f.id === "dob"){
      const age = (Date.now() - new Date(state.answers.dob).getTime()) / 31557600000;
      if (!(age >= 18)) flag(f.id, "التسجيل لمن أتم الثامنة عشرة فقط");
    }
    if (f.req && !state.imp[f.id] && !NO_PREF.has(state.answers[f.id]))
      flag(f.id, "حدد درجة الأهمية للشروط المظللة");
  }
  if (sec.id === "reqs" && ids.length === 0 && setCriteria() < MIN_CRITERIA){
    return { msg: `حدد ${MIN_CRITERIA} شروط على الأقل بدرجة غير "لا يهم" حتى يعمل التوافق`, ids: [] };
  }
  return ids.length || msg ? { msg, ids } : null;
}

// Feature D — نموذج توضيحي مبسّط: يطبّق منطق الشروط الحاسمة (فلتر) وأوزان
// الأهمية على شريك افتراضي ثابت. رقم توضيحي فقط، ليس محرّك التوافق الحقيقي.
const IMP_WEIGHT = { "أساسي":8, "مفضل":4, "يُستحسن":1, "لا يهم":0 };
function strHash(s){ let h = 0; for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; } return h % 100; }
function illustrativeScore(){
  let wSum = 0, wHit = 0, blocked = false;
  for (const sec of SECTIONS){
    for (const f of sec.fields){
      if (!f.req) continue;
      const imp = state.imp[f.id];
      if (!imp || imp === "لا يهم") continue;
      const satisfied = strHash(f.id) < (imp === "شرط حاسم" ? 85 : 72);
      if (imp === "شرط حاسم"){ if (!satisfied) blocked = true; continue; }
      const w = IMP_WEIGHT[imp] || 0;
      wSum += w; if (satisfied) wHit += w;
    }
  }
  const score = wSum === 0 ? (blocked ? 0 : 100) : Math.round(wHit / wSum * 100);
  return { blocked, score };
}

function collectRows(){
  const rows = [["القسم","السؤال","الإجابة","درجة الأهمية"]];
  for (const sec of SECTIONS){
    for (const f of visibleFields(sec)){
      let val = "";
      if (f.t === "range") val = `من ${state.answers[f.id+"_min"]??""} إلى ${state.answers[f.id+"_max"]??""}`;
      else if (f.t === "kidages"){
        const n = kidsN();
        val = Array.from({length:n}, (_,i)=>state.answers[`kidAge_${i+1}`]??"").join(" / ");
      }
      else if (f.t === "multi") val = (state.answers[f.id]||[]).join(" / ");
      else val = state.answers[f.id] ?? "";
      rows.push([sec.title, f.l, String(val), state.imp[f.id] ?? ""]);
    }
  }
  for (const s of SECTIONS) rows.push(["التوقيت", s.title, String(state.timings[s.id]||0) + " ثانية", ""]);
  for (const k in state.feedback) rows.push(["رأي المستخدم", k, state.feedback[k] ?? "", ""]);
  return rows;
}

function download(name, mime, content){
  const blob = new Blob([content], {type: mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

/* إكسل حقيقي: ملف xlsx أصلي (أرشيف مضغوط قياسي) — يفتح بلا أي تحذير،
   والورقة يمين-لليسار والنص محاذى لليمين. بلا أي مكتبات خارجية. */
const xmlEsc = s => String(s).replaceAll("&","&amp;").replaceAll("<","&lt;")
  .replaceAll(">","&gt;").replaceAll('"',"&quot;");

function sheetXml(rows){
  const colLetter = i => String.fromCharCode(65 + i); // A..D
  const rowsXml = rows.map((r, ri) =>
    `<row r="${ri+1}">` + r.map((c, ci) =>
      `<c r="${colLetter(ci)}${ri+1}" t="inlineStr" s="1"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`
    ).join("") + `</row>`
  ).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
    `<sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews>` +
    `<cols><col min="1" max="1" width="26" customWidth="1"/><col min="2" max="2" width="34" customWidth="1"/>` +
    `<col min="3" max="3" width="44" customWidth="1"/><col min="4" max="4" width="18" customWidth="1"/></cols>` +
    `<sheetData>${rowsXml}</sheetData></worksheet>`;
}

// --- كاتب أرشيف مضغوط قياسي (تخزين بلا ضغط) ---
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const u16 = v => new Uint8Array([v & 255, (v >> 8) & 255]);
  const u32 = v => new Uint8Array([v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]);
  for (const [name, content] of files){
    const nameB = enc.encode(name);
    const data = enc.encode(content);
    const crc = crc32(data);
    const local = [new Uint8Array([0x50,0x4B,3,4]), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0), nameB, data];
    central.push([new Uint8Array([0x50,0x4B,1,2]), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset), nameB]);
    for (const p of local){ parts.push(p); offset += p.length; }
  }
  const centralStart = offset;
  let centralSize = 0;
  for (const entry of central) for (const p of entry){ parts.push(p); centralSize += p.length; }
  parts.push(new Uint8Array([0x50,0x4B,5,6]), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralSize), u32(centralStart), u16(0));
  return new Blob(parts, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function excelBlob(rows){
  return makeZip([
    ["[Content_Types].xml", XLSX_STATIC["[Content_Types].xml"]],
    ["_rels/.rels", XLSX_STATIC["_rels/.rels"]],
    ["xl/workbook.xml", XLSX_STATIC["xl/workbook.xml"]],
    ["xl/_rels/workbook.xml.rels", XLSX_STATIC["xl/_rels/workbook.xml.rels"]],
    ["xl/styles.xml", XLSX_STATIC["xl/styles.xml"]],
    ["xl/worksheets/sheet1.xml", sheetXml(rows)],
  ]);
}

/* ============================================================
   v1.1 — «المرآة» (تعرف على نفسك) + بطاقة التعريف القابلة للمشاركة
   Track A throwaway. لا يخرج شيء من الجهاز إلا بضغطة المستخدم.
   ============================================================ */

const IMP_W = { "شرط حاسم":8, "أساسي":5, "مفضل":3, "يُستحسن":1, "لا يهم":0 };

const DOMAINS = [
  { id:"deen",    label:"الدين والالتزام",     ids:["rPrayer","rFajr","rQuran","rLookM","rLookF","rCelebration"] },
  { id:"akhlaq",  label:"الأخلاق والعادات",     ids:["rTobacco","rIntox","rJewelry","rTattoo","rSocial","rConflict","rHumour"] },
  { id:"usra",    label:"الحياة الأسرية والبيت", ids:["rMarital","rMaritalF","rKids","rLiving","rHousingReady","rReadiness","rWantKids","rInlaws",
                                                     "rCooking","rCleaning","rChildcare","rHomeHelp","rHelpProvided"] },
  { id:"eduWork", label:"التعليم والعمل",       ids:["rEdu","rWork","rWifeWork","rLanguage","rCar","rClub","rReading","rHobbies"] },
  { id:"mazhar",  label:"المظهر والصحة",        ids:["rAge","rHeight","rWeight","rSkin","rHealth","rNat","rBodySpecial"] },
  { id:"madi",    label:"الوضع المادي",         ids:["rFin","rFinModel"] },
];
const DOMAIN_OF = (() => { const m={}; for (const d of DOMAINS) for (const i of d.ids) m[i]=d.id; return m; })();

/* وسم النسخة التجريبية لا يظهر لصاحب البطاقة ولا في مرآته */
const clean = (s) => String(s || "").replace(/\s*\(قيد التجربة\)\s*/g, "").trim();

const REQ_SEC = () => SECTIONS.find(s => s.id === "reqs");
const fieldById = (id) => { for (const s of SECTIONS) { const f = s.fields.find(x=>x.id===id); if (f) return f; } return null; };
const A = (id) => state.answers[id];

/* القيمة المختارة لمعيار الطلب (المدى يُعرض كنطاق) */
function reqValue(id){
  const f = fieldById(id);
  if (f && f.t === "range"){
    const lo = state.answers[id+"_min"], hi = state.answers[id+"_max"];
    return (lo==null||hi==null) ? "" : `من ${ar(lo)} إلى ${ar(hi)}`;
  }
  const v = state.answers[id];
  if (Array.isArray(v)) return v.join("، ");
  return (v==null || v==="") ? "" : String(v);
}

/* كل المعايير الفعّالة مرتبة بالأثقل */
function activeCriteria(){
  const out = [];
  const sec = REQ_SEC(); if (!sec) return out;
  for (const f of sec.fields){
    const imp = state.imp[f.id];
    if (!imp || imp === "لا يهم") continue;
    const val = reqValue(f.id);
    if (!val || NO_PREF.has(val)) continue;
    // «short» تسمية مختصرة للبطاقة والمرآة حين تكون صيغة السؤال طويلة
    out.push({ id:f.id, label:clean(f.short || f.l), value:clean(val), imp, w:IMP_W[imp] ?? 0,
               db: imp === "شرط حاسم", domain: DOMAIN_OF[f.id] || "eduWork" });
  }
  return out.sort((a,b) => b.w - a.w);
}

/* وزن كل مجال كنسبة من مجموع الأوزان */
function domainWeights(){
  const crit = activeCriteria();
  const tot = crit.reduce((s,c)=>s+c.w, 0);
  return DOMAINS.map(d => {
    const mine = crit.filter(c => c.domain === d.id);
    return { id:d.id, label:d.label, n:mine.length,
             w: mine.reduce((s,c)=>s+c.w,0),
             pct: tot ? Math.round(mine.reduce((s,c)=>s+c.w,0) / tot * 100) : 0 };
  }).sort((a,b) => b.pct - a.pct);
}

function ownAge(){
  const d = A("dob"); if (!d) return null;
  const t = new Date(d); if (isNaN(t)) return null;
  return Math.floor((Date.now() - t.getTime()) / (365.25*24*3600*1000));
}

/* اتساع دائرة البحث — وصف صادق، لا رقم مُوهِم */
function breadthBand(){
  const n = dbCount();
  if (n === 0) return { cls:"b1", text:"منفتحة جداً", note:"لم تضع شرطاً حاسماً واحداً." };
  if (n <= 3)  return { cls:"b1", text:"واسعة", note:"شروطك الحاسمة قليلة، ودائرة البحث أمامك كبيرة." };
  if (n <= 5)  return { cls:"b2", text:"متوازنة", note:"عدد معقول من الشروط الحاسمة." };
  if (n <= 7)  return { cls:"b3", text:"ضيقة", note:"كل شرط حاسم يستبعد فئة كاملة — الدائرة تضيق." };
  return { cls:"b4", text:"ضيقة جداً", note:"استخدمت كل شروطك الحاسمة الثمانية." };
}

/* ---- المرآة الهادئة: تُظهر التعارض وتسأل، ولا تحكم ---- */
function reflections(){
  const out = [];
  const crit = activeCriteria();
  const dbs  = crit.filter(c => c.db);
  const gender = A("gender");
  const add = (t, body) => out.push({ t, body });

  // 1) أين يقع ثقل الشروط الحاسمة
  if (dbs.length >= 3){
    const inDeen = dbs.filter(c => c.domain === "deen").length;
    const surface = dbs.filter(c => c.domain === "mazhar" || c.domain === "madi").length;
    if (inDeen === 0 && surface >= Math.ceil(dbs.length/2))
      add("تأمّل معنا",
        "معظم شروطك الحاسمة عن المظهر والحالة المادية، وليس بينها شرط واحد عن الدين أو الخلق. "+
        "لا حكم علينا في هذا — نعرضه فقط لتتأكد أنه ما تقصده فعلاً.");
  }

  // 2) الصلاة — أرقّ ما يُقال
  if (["متقطع","لا أصلي حالياً"].includes(A("prayer")) && A("rPrayer") === "محافظ على الخمس")
    add("لاحظنا",
      "تطلب في شريك حياتك محافظةً على الصلاة أعلى من التزامك الحالي. "+
      "وكثيرون يطلبون من يعينهم على الخير — فإن كان هذا قصدك فلا تُغيّر شيئاً.");

  // 3) التوقيت
  if (A("rReadiness") === "جاهز قريباً (خلال سنة)" && ["أكثر من سنة","حسب الظروف"].includes(A("readiness")))
    add("توقيتان متباعدان",
      "تطلب شريكاً جاهزاً للزواج خلال سنة، وذكرت أن جاهزيتك أنت أبعد من ذلك. "+
      "تأمّل هل التوقيتان متقاربان بما يكفي.");

  // 4) السكن
  if (A("rLiving") === "شقة مستقلة ضرورية" && ["قيد التجهيز","سنجهزه بعد الاتفاق"].includes(A("housingReadiness")))
    add("السكن",
      "تشترط شقة مستقلة، وسكنك ما زال قيد التجهيز. وهذا شائع جداً — "+
      "تأكد فقط أن الطرف الآخر سيعرفه من البداية.");

  // 5) التعليم
  if (["دكتوراه","ماجستير فأعلى"].includes(A("rEdu")) &&
      ["بدون مؤهل","إعدادي","ثانوي / دبلوم"].includes(A("education")))
    add("فارق المؤهل",
      "تطلب مؤهلاً أعلى بكثير من مؤهلك. هذا حقك الكامل، ننبّه فقط أنه يضيّق دائرة البحث كثيراً.");

  // 6) المادي
  if (A("rFin") === "ممتاز" && ["محدود","متوسط"].includes(A("fin")))
    add("الوضع المادي",
      "تطلب وضعاً مادياً ممتازاً، ووضعك الحالي دونه. لا شيء في هذا خطأ — "+
      "تأكد فقط أنك مستعد لما قد يترتب عليه.");

  // 7) الأولاد
  if (A("kids") === "نعم" && A("rKids") === "مرفوض تماماً")
    add("الأولاد",
      "لديك أولاد، وترفض تماماً وجود أولاد لدى الطرف الآخر. "+
      "تأمّل: هل هذا ما تريده حقاً، أم أنه يستحق إعادة نظر؟");

  // 8) التدخين — ما لا يقبله في غيره وهو يفعله
  {
    const tob = Array.isArray(A("rTobacco")) ? A("rTobacco") : [];
    const acceptsAny = tob.includes("أقبل أي نوع");
    const accepts = (k) => acceptsAny || tob.includes(k);
    const mine = [];
    if (["أحياناً","مدخن"].includes(A("smoking")) && !accepts("السجائر")) mine.push("السجائر");
    if (["نادراً","نعم"].includes(A("shisha"))    && !accepts("الشيشة"))  mine.push("الشيشة");
    if (["نادراً","نعم"].includes(A("vape"))      && !accepts("الفيب"))   mine.push("الفيب");
    if (tob.length && mine.length)
      add("التدخين",
        `ترفض ${mine.join(" و")} في شريك حياتك، وذكرت في إجاباتك أنك تدخّنها.`);
  }

  // 9) الفارق العمري
  const age = ownAge();
  const lo = state.answers["rAge_min"], hi = state.answers["rAge_max"];
  if (age && lo!=null && hi!=null){
    if (gender === "ذكر" && hi <= age - 12)
      add("الفارق العمري",
        `تطلب من تصغرك بـ ${age - hi} سنة على الأقل. وارد ومقبول، لكنه يضيّق الاختيار كثيراً.`);
    if (gender === "أنثى" && lo >= age + 15)
      add("الفارق العمري",
        `تطلبين من يكبرك بـ ${lo - age} سنة على الأقل. وارد، لكنه يضيّق الاختيار كثيراً.`);
  }

  // 10) استخدام الشروط الحاسمة
  if (dbs.length >= DB_CAP)
    add("كل شروطك حاسمة",
      "استخدمت شروطك الحاسمة الثمانية كاملة. الشرط الحاسم يستبعد الطرف تماماً مهما كان بقية توافقكما — "+
      "هل كلها فعلاً مما لا تقبل التنازل عنه؟");
  else if (dbs.length === 0 && crit.length > 0)
    add("لا شرط حاسم",
      "لم تضع أي شرط حاسم. الانفتاح جميل — تأكد فقط أن هناك أموراً لا تقبل التفريط فيها.");

  if (crit.length < MIN_CRITERIA)
    add("معايير قليلة",
      `حددت ${crit.length} معياراً فقط، ونحتاج ${MIN_CRITERIA} على الأقل. `+
      "كلما وضّحت ما يهمك، كان التوافق أدق وأقرب لك.");

  return out;
}
